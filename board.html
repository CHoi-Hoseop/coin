<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슈퍼챗 전광판</title>
<style>
  :root { --gold: #ffd54a; --hot: #ff2d6f; --bg: #07060d; --vio: #6a1bff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(1200px 700px at 50% -10%, #2a0f3f 0%, var(--bg) 60%); color: #fff; font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; }
  body.shake #app { animation: shake .5s; }
  @keyframes shake { 10%,50%,90% { transform: translate(-1.2vw, .6vh); } 30%,70% { transform: translate(1.2vw, -.6vh); } }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 18; }
  #flash.go { animation: flash .6s; } @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
  #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 16; pointer-events: none; }

  #app { display: grid; grid-template-rows: auto 1fr; height: 100vh; padding: 2.2vh 3vw 2vh; gap: 1.6vh; }
  #top { display: flex; align-items: flex-end; justify-content: space-between; gap: 2vw; }
  #title { font-size: clamp(22px, 4.2vh, 56px); font-weight: 900; letter-spacing: .04em; background: linear-gradient(90deg, #fff, var(--gold) 60%, var(--hot)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #grand { text-align: right; line-height: 1; }
  #grand small { display: block; font-size: clamp(12px, 2vh, 22px); color: #b9aedb; letter-spacing: .3em; margin-bottom: .4vh; }
  #grandNum { font-size: clamp(34px, 8vh, 110px); font-weight: 900; color: var(--gold); text-shadow: 0 0 24px rgba(255,213,74,.55); font-variant-numeric: tabular-nums; }
  #grandNum i, .val i { font-style: normal; font-size: .45em; margin-left: .2em; color: #fff; }
  body[data-mode=stage] #grand, body[data-mode=tally] #grand { visibility: hidden; }
  #main { display: grid; grid-template-columns: 1fr 26vw; gap: 2vw; min-height: 0; }
  body[data-mode=tally] #main { grid-template-columns: 1fr; } body[data-mode=tally] #feedBox { display: none; }

  /* ----- 전체 순위 ----- */
  #rank { position: relative; min-height: 0; display: none; }
  body[data-mode=all] #rank, body[data-mode=tally] #rank { display: block; }
  .row { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 1.2vw; transition: top .8s cubic-bezier(.2,.8,.2,1); }
  .pos { width: 2.2em; text-align: center; font-weight: 900; font-size: var(--fs); color: #8a7fb0; }
  .row.r1 .pos { color: var(--gold); text-shadow: 0 0 18px rgba(255,213,74,.8); } .row.r2 .pos { color: #e0e6f2; } .row.r3 .pos { color: #e0a470; }
  .barwrap { flex: 1; position: relative; height: 78%; background: rgba(255,255,255,.06); border-radius: 999px; overflow: hidden; }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--vio), var(--hot) 70%, #ff9a3c); transition: width .9s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 22px rgba(255,45,111,.55); }
  .row.r1 .bar { background: linear-gradient(90deg, #ff9a3c, var(--gold)); box-shadow: 0 0 30px rgba(255,213,74,.7); }
  .name { position: absolute; left: 1.4vw; top: 0; bottom: 0; display: flex; align-items: center; font-size: calc(var(--fs) * .78); font-weight: 800; text-shadow: 0 2px 6px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; max-width: 70%; }
  .val { width: 7.2em; text-align: right; font-size: var(--fs); font-weight: 900; font-variant-numeric: tabular-nums; }
  .val i { color: #b9aedb; font-size: .55em; }
  .row.bump .val { animation: bump .5s; } @keyframes bump { 30% { transform: scale(1.18); color: var(--gold); } }

  /* ----- 팀 집중(공연 중) ----- */
  #stageV { position: relative; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 0; }
  body[data-mode=stage] #stageV { display: flex; }
  #orb { position: absolute; width: 70vh; height: 70vh; border-radius: 50%; background: radial-gradient(circle, rgba(255,213,74,.22), rgba(255,45,111,.1) 45%, transparent 68%); animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.12); opacity: .75; } }
  #sLabel { position: relative; font-size: clamp(14px, 2.6vh, 30px); letter-spacing: .6em; color: #ff8aa8; font-weight: 800; }
  #sLabel::before { content: '● '; color: #ff2d6f; animation: blink 1.2s infinite; } @keyframes blink { 50% { opacity: .2; } }
  #sName { position: relative; font-size: clamp(30px, 10vh, 150px); font-weight: 900; margin: 1vh 0 0; line-height: 1.1; background: linear-gradient(90deg, #fff, #ffe9a0 50%, #fff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
  #sTotal { position: relative; font-size: clamp(60px, 27vh, 400px); font-weight: 900; line-height: 1; color: var(--gold); text-shadow: 0 0 40px rgba(255,213,74,.65), 0 0 120px rgba(255,154,60,.4); font-variant-numeric: tabular-nums; margin-top: 1vh; }
  #sTotal i { font-style: normal; font-size: .32em; margin-left: .12em; color: #fff; }
  #sTotal.hit { animation: hit .55s; } @keyframes hit { 25% { transform: scale(1.12); filter: brightness(1.5); } }
  #sSub { position: relative; font-size: clamp(14px, 2.8vh, 34px); color: #cfc6ee; margin-top: 1vh; }

  /* ----- 후원 목록 ----- */
  #feedBox { display: flex; flex-direction: column; min-height: 0; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 2vh; padding: 1.4vh 1vw; }
  #feedBox h3 { margin: 0 0 1vh; font-size: clamp(14px, 2.2vh, 26px); color: #b9aedb; letter-spacing: .25em; }
  #feed { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 1vh; }
  .fi { padding: 1.1vh 1vw; border-radius: 1.4vh; background: rgba(255,255,255,.08); font-size: clamp(14px, 2.5vh, 30px); animation: slide .5s; line-height: 1.25; }
  .fi b { color: var(--gold); } .fi em { font-style: normal; color: var(--hot); font-weight: 900; } .fi.nb { animation: none; }
  @keyframes slide { from { transform: translateX(40px); opacity: 0; } }

  /* ----- 후원 팝업 (금액별 4단계) ----- */
  #pop { position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 20; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .pop { position: relative; text-align: center; padding: 3vh 5vw; border-radius: 5vh; animation: popin var(--dur, 2.4s) forwards; background: linear-gradient(135deg, #5b16d6, #d8185f); box-shadow: 0 0 90px rgba(255,45,111,.85); max-width: 90vw; }
  .pop .rib { position: absolute; left: 50%; top: -2.6vh; transform: translateX(-50%); padding: .5vh 2vw; border-radius: 99px; background: #fff; color: #d8185f; font-weight: 900; letter-spacing: .25em; font-size: clamp(12px, 2.4vh, 28px); white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  .pop .amt { font-size: clamp(50px, 17vh, 240px); font-weight: 900; line-height: 1; text-shadow: 0 6px 0 rgba(0,0,0,.25), 0 0 40px rgba(255,255,255,.4); font-variant-numeric: tabular-nums; animation: amt .7s cubic-bezier(.2,1.6,.4,1); }
  .pop .amt span { font-size: .35em; margin-left: .1em; }
  .pop .who { font-size: clamp(22px, 5.4vh, 80px); font-weight: 900; margin-top: 1vh; }
  .pop .to { font-size: clamp(16px, 3.4vh, 48px); opacity: .95; margin-top: .6vh; }
  .pop.t2 { background: linear-gradient(135deg, #ff7a18, #ff2d6f); box-shadow: 0 0 110px rgba(255,122,24,.9); }
  .pop.t3 { background: linear-gradient(135deg, #ffb400, #ff6a00); color: #2b1300; box-shadow: 0 0 140px rgba(255,213,74,1); } .pop.t3 .rib { background: #2b1300; color: var(--gold); }
  .pop.t4 { background: linear-gradient(135deg, #fff2a8, #ffd54a 40%, #ff8a00); color: #2b1300; box-shadow: 0 0 200px rgba(255,255,255,1), 0 0 90px rgba(255,213,74,1); padding: 5vh 7vw; } .pop.t4 .rib { background: linear-gradient(90deg, #ff2d6f, #6a1bff); color: #fff; font-size: clamp(14px, 3vh, 36px); }
  .pop .rays { position: absolute; inset: -60%; z-index: -1; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.22) 0 6deg, transparent 6deg 18deg); border-radius: 50%; animation: spin 6s linear infinite; mask-image: radial-gradient(circle, #000 20%, transparent 60%); -webkit-mask-image: radial-gradient(circle, #000 20%, transparent 60%); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes amt { 0% { transform: scale(.2) rotate(-8deg); } 100% { transform: scale(1); } }
  @keyframes popin { 0% { transform: scale(.3); opacity: 0; } 10% { transform: scale(1.12); opacity: 1; } 18% { transform: scale(1); } 86% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.12); opacity: 0; } }

  /* ----- 카운트다운 ----- */
  #cd { position: fixed; inset: 0; z-index: 24; background: radial-gradient(circle at 50% 45%, rgba(106,27,255,.55), rgba(7,6,13,.96) 70%); display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #cd.on { display: flex; }
  #cdLabel { font-size: clamp(20px, 5vh, 70px); font-weight: 900; letter-spacing: .3em; color: #ff8aa8; }
  #cdNum { font-size: clamp(120px, 52vh, 700px); font-weight: 900; line-height: 1; color: #fff; text-shadow: 0 0 60px rgba(255,45,111,.9), 0 0 160px rgba(106,27,255,.8); font-variant-numeric: tabular-nums; }
  #cdNum.tick { animation: tick .9s; } @keyframes tick { 0% { transform: scale(1.5); opacity: .2; } 30% { transform: scale(1); opacity: 1; } 100% { transform: scale(.92); } }
  #cdNum.end { font-size: clamp(60px, 22vh, 320px); color: var(--gold); animation: none; letter-spacing: .06em; }
  #cdSub { font-size: clamp(16px, 3.2vh, 40px); color: #cfc6ee; margin-top: 1vh; min-height: 1.4em; }

  /* ----- 우승 발표 ----- */
  #win { position: fixed; inset: 0; z-index: 26; background: radial-gradient(circle at 50% 40%, rgba(255,213,74,.28), transparent 65%), #07060d; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #win.on { display: flex; }
  #wSmall { font-size: clamp(20px, 5vh, 70px); letter-spacing: .4em; color: #ffd54a; font-weight: 900; }
  #wMain { font-size: clamp(60px, 22vh, 320px); font-weight: 900; line-height: 1.05; margin: 1vh 4vw; max-width: 94vw; }
  #wMain.q { font-size: clamp(120px, 50vh, 600px); color: #fff; animation: qp .6s infinite; text-shadow: 0 0 80px rgba(255,213,74,.9); } @keyframes qp { 50% { transform: scale(1.15); } }
  #wMain.rev { background: linear-gradient(90deg, #fff6c8, #ffd54a 40%, #ff9a3c); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 40px rgba(255,213,74,.9)); animation: reveal 1.1s cubic-bezier(.2,1.5,.4,1); }
  @keyframes reveal { 0% { transform: scale(.1) rotate(-6deg); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  #wCrown { font-size: clamp(50px, 16vh, 220px); line-height: 1; opacity: 0; } #wCrown.on { animation: crown 1s forwards; } @keyframes crown { 0% { transform: translateY(-30vh) rotate(-20deg); opacity: 0; } 60% { transform: translateY(1vh) rotate(6deg); opacity: 1; } 100% { transform: none; opacity: 1; } }
  #wTotal { font-size: clamp(28px, 8vh, 110px); font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; min-height: 1.2em; }
  #wRest { font-size: clamp(16px, 3.2vh, 44px); color: #cfc6ee; margin-top: 2vh; }
  #hint { position: fixed; left: 0; right: 0; bottom: 2.4vh; text-align: center; z-index: 22; font-size: clamp(14px, 2.4vh, 28px); color: #b9aedb; animation: blink 1.6s infinite; display: none; }

  /* ----- 로그인 / 조작판 ----- */
  #login { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  #login[hidden], [hidden] { display: none !important; }
  #login input { font-size: 30px; padding: 12px 18px; width: 280px; text-align: center; border-radius: 12px; border: 2px solid var(--vio); background: #14102a; color: #fff; letter-spacing: 6px; }
  #login button { font-size: 20px; padding: 12px 28px; border: 0; border-radius: 12px; background: linear-gradient(90deg, var(--vio), var(--hot)); color: #fff; font-weight: 800; }
  #msg { color: #ff8aa8; min-height: 1.4em; }
  #ctl { position: fixed; right: 12px; bottom: 12px; z-index: 40; width: min(440px, 92vw); background: rgba(20,16,42,.94); border: 1px solid rgba(255,255,255,.18); border-radius: 16px; padding: 12px; opacity: 0; pointer-events: none; transition: opacity .3s; font-size: 14px; }
  body.showctl #ctl { opacity: 1; pointer-events: auto; }
  #ctl .r { display: flex; gap: 6px; margin-bottom: 7px; align-items: center; flex-wrap: wrap; }
  #ctl button, #ctl select { font-size: 14px; padding: 8px 10px; border: 0; border-radius: 9px; background: #2f2866; color: #fff; font-weight: 700; }
  #ctl button.on { background: linear-gradient(90deg, var(--vio), var(--hot)); } #ctl button.go { background: linear-gradient(90deg, #ff7a18, #ff2d6f); }
  #ctl select { flex: 1; min-width: 0; } #ctl .k { color: #9d93c9; font-size: 12px; line-height: 1.5; } #ctl label { color: #cfc6ee; font-size: 13px; }
  #conn { position: fixed; left: 10px; bottom: 8px; z-index: 30; font-size: 14px; color: #ff8aa8; }
  #toast { position: fixed; left: 50%; top: 3vh; transform: translateX(-50%); z-index: 60; background: #14102a; border: 1px solid #ff2d6f; padding: 10px 20px; border-radius: 12px; font-size: 18px; display: none; }
</style>
</head>
<body data-mode="stage">
<div id="login">
  <div style="font-size:34px;font-weight:900;color:var(--gold)">🎤 슈퍼챗 전광판</div>
  <div style="color:#b9aedb">운영 PIN을 입력하세요</div>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter')start()">
  <button onclick="start()">시작</button>
  <div id="msg"></div>
</div>

<div id="app">
  <div id="top"><div id="title">SUPER CHAT</div><div id="grand"><small id="grandLabel">TOTAL</small><span id="grandNum">0<i>C</i></span></div></div>
  <div id="main">
    <div id="rank"></div>
    <div id="stageV">
      <div id="orb"></div>
      <div id="sLabel">NOW PERFORMING</div>
      <div id="sName">-</div>
      <div id="sTotal">0<i>C</i></div>
      <div id="sSub"></div>
    </div>
    <div id="feedBox"><h3>LIVE</h3><div id="feed"></div></div>
  </div>
</div>

<div id="cd"><div id="cdLabel">슈퍼챗 마감까지</div><div id="cdNum">10</div><div id="cdSub"></div></div>
<div id="win"><div id="wSmall"></div><div id="wCrown">👑</div><div id="wMain"></div><div id="wTotal"></div><div id="wRest"></div></div>
<div id="hint"></div>
<div id="flash"></div>
<canvas id="fx"></canvas>
<div id="pop"></div>
<div id="conn"></div>
<div id="toast"></div>

<div id="ctl">
  <div id="ctlSuper">
    <div class="r"><button id="mStage" onclick="setMode('stage')">🎤 팀 집중</button><button id="mAll" onclick="setMode('all')">📊 전체 순위</button></div>
    <div class="r"><button onclick="stepTeam(-1)">◀</button><select id="teamSel" onchange="pickTeam(this.value)"></select><button onclick="stepTeam(1)">▶</button></div>
    <div class="r"><select id="cdSec" style="flex:0 0 auto"><option>5</option><option selected>10</option><option>15</option><option>20</option></select><span style="color:#cfc6ee">초</span><button class="go" onclick="startCountdown()">⏱ 마감 카운트다운</button></div>
    <div class="r"><label><input type="checkbox" id="autoClose" checked> 0초가 되면 슈퍼챗 자동 마감</label></div>
    <div class="r"><button onclick="toTally()">🏁 결과 집계</button><button onclick="toWinner()">🏆 우승 공개</button><button onclick="reopen()">🔓 슈퍼챗 다시 열기</button></div>
  </div>
  <div class="r"><button id="btnSnd" onclick="toggleSound()">🔊 효과음 끄기</button><button onclick="toggleFull()">⛶ 전체화면</button><button onclick="testFx()">✨ 팝업 시험</button></div>
  <div class="k" id="ctlKeys">단축키 · ←/→ 팀 바꾸기 · 1 팀 집중 · 2 전체 순위 · <b>스페이스 = 다음 단계</b>(카운트다운 → 결과 집계 → 우승 공개) · Esc 처음으로 · S 소리 · F 전체화면</div>
</div>

<script>
/* 서버 주소 (index.html 의 API_URL 과 같은 주소) */
var API_URL = 'https://script.google.com/macros/s/AKfycbxBcTW2Pmh0zMAMqXArfnAmiRgTCuyfuoRXJegWzeFzf-a8GzWyjX2aoPSG1CaYIvxV/exec';
var POLL_MS = 2500;
var VIEW = /[?&]view=work/.test(location.search) ? 'work' : 'super';   // board.html?view=work → 작품 응원 순위
var FN = VIEW === 'work' ? 'workBoard' : 'board';
var TIER2 = 300, TIER3 = 500, TIER4 = 1000;    // 팝업 단계 기준 금액 (작품 보기는 아래에서 낮춤)
if (VIEW === 'work') { TIER2 = 200; TIER3 = 300; TIER4 = 500; }

var pin = '', data = null, mode = (VIEW === 'work' ? 'all' : 'stage'), stageNo = null;
var seen = {}, firstLoad = true, queue = [], showing = false, sound = true, actx = null, rows = {}, shown = {};
var grandShown = 0, failN = 0, stageShown = 0, timers = [], pollT = null, finale = 0;

function $(id) { return document.getElementById(id); }
function fmt(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function toast(m) { var t = $('toast'); t.innerText = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 3500); }

function api(fn, args) {
  return fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) { if (j && j.error) throw new Error(j.error); return j.result; });
}

/* ================= 시작 / 갱신 ================= */
function start() {
  pin = $('pin').value.trim(); if (!pin) return;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
  $('msg').innerText = '확인 중...';
  api(FN, [pin]).then(function (r) {
    if (!r.ok) { $('msg').innerText = r.msg; return; }
    try { sessionStorage.setItem('boardPin', pin); } catch (e) {}
    $('login').hidden = true;
    if (VIEW === 'work') $('ctlSuper').hidden = true, $('ctlKeys').hidden = true;
    apply(r); pollT = setInterval(poll, POLL_MS); showCtl(7000);
  }).catch(function (e) { $('msg').innerText = '서버 연결 실패: ' + e.message; });
}
function poll() {
  return api(FN, [pin]).then(function (r) { failN = 0; $('conn').innerText = ''; if (r.ok) apply(r); })
    .catch(function () { if (++failN >= 2) $('conn').innerText = '⚠ 연결 끊김 — 다시 연결 중...'; });
}

function teamsByNo() { return data.teams.slice().sort(function (a, b) { return Number(a.no) - Number(b.no); }); }
function teamsByTotal() { return data.teams.slice().sort(function (a, b) { return b.total - a.total || Number(a.no) - Number(b.no); }); }
function teamOf(no) { for (var i = 0; i < data.teams.length; i++) if (data.teams[i].no === String(no)) return data.teams[i]; return null; }

function apply(r) {
  data = r;
  $('title').innerText = r.title || '슈퍼챗';
  fillTeamSel();
  // 새 후원 → 알림 대기열 (지금 화면에 해당하는 것만 팝업)
  r.recent.forEach(function (d) {
    if (seen[d.id]) return; seen[d.id] = 1;
    if (firstLoad) return;
    if (mode === 'all' || (mode === 'stage' && d.team === stageNo)) queue.push(d);
  });
  if (firstLoad) { firstLoad = false; if (stageNo === null) stageNo = defaultTeam(); }
  render();
  runQueue();
}
function defaultTeam() { // 가장 최근 후원을 받은 팀, 없으면 1번 팀
  if (data.recent.length) return data.recent[data.recent.length - 1].team;
  var l = teamsByNo(); return l.length ? l[0].no : null;
}

function render() {
  if (!data) return;
  if (mode === 'all') {
    layout(teamsByTotal(), {});
    tween($('grandNum'), grandShown, data.grand, function (v) { return fmt(v) + '<i>C</i>'; }); grandShown = data.grand;
    $('grandLabel').innerText = VIEW === 'work' ? 'TOTAL 응원' : 'TOTAL';
    syncFeed();
  } else if (mode === 'stage') {
    var t = teamOf(stageNo);

  if (mode === 'stage' || mode === 'all') startCountdown();
  else if (mode === 'tally') { if (finale >= 3) toWinner(); else toast('집계가 끝난 뒤 눌러 주세요'); }
  else if (mode === 'count') { /* 카운트다운 진행 중 */ }
}

document.addEventListener('click', function (e) { if (e.target.tagName === 'BUTTON') e.target.blur(); });
try { var sp = sessionStorage.getItem('boardPin'); if (sp) { $('pin').value = sp; } } catch (e) {}
document.body.dataset.mode = mode; $('mStage').classList.toggle('on', mode === 'stage');
</script>
