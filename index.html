<style>
/* ===== 화면 다듬기 (기존 스타일 위에 덮어쓰기) ===== */
:root { --ink: #1b2437; --muted: #6b7690; --line: #e3e7f0; --card: #fff; --brand: #3b5bfd; }
body { min-height: 100vh; background: linear-gradient(180deg, #eef1fb 0%, #f7f8fc 60%); color: var(--ink); font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif; }
header { background: linear-gradient(90deg, #1b2a52, #31408a); font-size: 20px; letter-spacing: .02em; padding: 14px; box-shadow: 0 2px 10px rgba(27,42,82,.25); position: sticky; top: 0; z-index: 40; }
header button { background: rgba(255,255,255,.18); border-radius: 999px; padding: 7px 14px; top: 10px; }
#modeLabel { font-size: 15px; font-weight: 600; margin-left: 8px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.18); }
#modeLabel:empty { display: none; }
section > p { color: var(--muted); font-weight: 700; }

/* 역할 선택: 카드형 버튼 */
#vMenu { max-width: 860px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; padding: 18px 16px; }
#vMenu > p { grid-column: 1 / -1; margin: 4px 0 0; font-size: 18px; }
#vMenu .big { width: 100%; max-width: none; margin: 0; padding: 22px 20px; border-radius: 20px; text-align: left; font-size: 22px; display: flex; align-items: center; gap: 14px;
  box-shadow: 0 6px 16px rgba(30,40,80,.16); transition: transform .08s; position: relative; overflow: hidden; }
#vMenu .big:active { transform: scale(.98); }
#vMenu .big::before { content: attr(data-ic); font-size: 34px; width: 56px; height: 56px; border-radius: 16px; background: rgba(255,255,255,.22); display: inline-flex; align-items: center; justify-content: center; flex: none; }
#vMenu .big[disabled] { background: #d9dde8 !important; color: #8b93a8; box-shadow: none; }
#vMenu .big[disabled]::before { background: rgba(0,0,0,.06); filter: grayscale(1); opacity: .6; }
.c-work { background: linear-gradient(135deg, #34c38f, #1f9d6f); } .c-in { background: linear-gradient(135deg, #14b8c4, #0b8f9b); }
.c-out { background: linear-gradient(135deg, #5b7cfa, #3b4fd1); } .c-booth { background: linear-gradient(135deg, #3aa0ff, #2272d6); }
.c-super { background: linear-gradient(135deg, #ff5c8a, #d81b60); } .c-wage { background: linear-gradient(135deg, #ffb347, #f08a00); }
.c-test { background: #6b7690; } .c-bal { background: linear-gradient(135deg, #8b5cf6, #6d3fe0); }
#bal { position: fixed; inset: 0; z-index: 96; background: linear-gradient(160deg, #2b1d6b, #4a2bb5 60%, #6d3fe0); color: #fff; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
#bal[hidden] { display: none; }
#bal .bn { font-size: 34px; font-weight: 700; opacity: .9; } #bal .bv { font-size: min(22vw, 150px); font-weight: 900; line-height: 1.05; color: #ffd54a; text-shadow: 0 0 30px rgba(255,213,74,.5); font-variant-numeric: tabular-nums; }
#bal .bv i { font-style: normal; font-size: .38em; color: #fff; margin-left: .15em; }
#bal .bs { font-size: 24px; margin: 10px 0 18px; opacity: .9; }
#bal .bl { max-width: 520px; margin: 0 auto; background: rgba(255,255,255,.12); border-radius: 18px; padding: 10px 18px; text-align: left; font-size: 22px; }
#bal .bl div { display: flex; justify-content: space-between; gap: 14px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.15); } #bal .bl div:last-child { border: 0; }
#bal .bl .m { color: #ff9ab8; font-weight: 700; } #bal .bl .p { color: #8dffbf; font-weight: 700; }
#bal .bh { margin-top: 16px; font-size: 17px; opacity: .7; }

/* PIN */
#vPin { max-width: 420px; margin: 8vh auto 0; background: var(--card); border-radius: 24px; padding: 30px 22px; box-shadow: 0 10px 30px rgba(30,40,80,.12); }
#vPin .big { width: 100%; margin-top: 16px; border-radius: 16px; background: linear-gradient(135deg, #3b5bfd, #2a3fc9) !important; }
input.pin { border: 2px solid var(--line); background: #f6f7fb; width: 100%; }
input.pin:focus { outline: none; border-color: var(--brand); background: #fff; }

/* 선택 칩 */
.chip { border: 2px solid var(--line); background: var(--card); border-radius: 16px; box-shadow: 0 2px 6px rgba(30,40,80,.07); font-weight: 700; padding: 14px 18px; }
.chip.sel { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(59,91,253,.4); }
#cfg { font-size: 16px; color: var(--muted); padding: 4px 8px; font-weight: 600; }

/* 카메라 */
#reader { border: 0; border-radius: 22px; box-shadow: 0 8px 24px rgba(20,30,70,.28); outline: 4px solid #fff; }
#vRun .chip[onclick*="Cam"], #vRun .chip[onclick*="Mirror"], #vRun .chip[onclick*="camFile"], #vRun .chip[onclick*="scanBeep"] { font-size: 14px; font-weight: 600; background: #eceff7; box-shadow: none; border: 0; color: #43506c; border-radius: 999px; }

/* 결과 카드 */
#result { border-radius: 18px; border: 0; border-left: 8px solid #c5cbdb; background: var(--card); box-shadow: 0 4px 14px rgba(30,40,80,.1); font-size: 26px; }
#result.ok { border-left-color: #2fb36a; background: #eefaf2; } #result.err { border-left-color: #e5484d; background: #fff1f1; }
#result.warn { border-left-color: #f5a524; background: #fff8e8; } #result.wait { border-left-color: #3b82f6; background: #eef5ff; }

/* 팝업·키패드 */
.kpbox { border-radius: 24px; } .keys button { border: 0; background: #eef0f7; font-weight: 700; box-shadow: 0 2px 0 #d7dbe8; } .keys button:active { background: #dfe3f2; }
.row2 button { border-radius: 16px; } .wbtn { border: 2px solid var(--line); border-radius: 16px; box-shadow: 0 2px 6px rgba(30,40,80,.07); }
.wbtn.sel { background: var(--brand); border-color: var(--brand); box-shadow: 0 4px 12px rgba(59,91,253,.4); }
.toast { border-radius: 20px; }

/* PIN 확인 창 */
#gate { position: fixed; inset: 0; z-index: 9999; background: rgba(15,20,40,.72); display: flex; align-items: center; justify-content: center; }
#gate[hidden] { display: none; }
#gate .gbox { background: #fff; border-radius: 24px; padding: 26px 22px; width: min(92vw, 400px); text-align: center; box-shadow: 0 16px 48px rgba(0,0,0,.4); }
#gate .gt { font-size: 24px; font-weight: 800; } #gate .gs { color: #667; font-size: 15px; margin: 6px 0 14px; }
#gate #gmsg { color: #c62828; min-height: 24px; font-weight: 700; margin-top: 6px; }
#gate .gb { display: flex; gap: 10px; margin-top: 8px; } #gate .gb button { flex: 1; border: 0; color: #fff; font-size: 18px; font-weight: 700; padding: 14px 0; border-radius: 14px; }

/* 📐 카메라 크기 조절 (세로 거치 시 아래 안내가 잘리면 --camw 값을 줄이세요. 예: 54vh → 48vh) */
:root { --camw: min(100%, 54vh); }
@media (orientation: landscape) { :root { --camw: min(100%, 72vh); } }
#reader { width: var(--camw); min-height: 0; }
</style>
</head>

<header>🪙 문화코인 <span id="modeLabel"></span></header>

<!-- 1. PIN -->
<section id="vPin">
  <p style="font-size:18px;font-weight:bold;">운영 PIN을 입력하세요</p>
  <input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter')unlock()">

<!-- 3. 대상 선택(발표/부스) -->
<section id="vSetup" hidden>

<section id="vRun" hidden>
  <div id="cfg"></div>
  <div id="cfgBtns" class="grid"></div>
  <div id="reader"></div>
  <div style="margin:4px">
    <button class="chip" style="min-width:0;font-size:14px;padding:6px 10px" onclick="flipCam()">📷 카메라 전환</button>
    <button class="chip" style="min-width:0;font-size:14px;padding:6px 10px" onclick="toggleMirror()">↔ 좌우반전</button>
    <button id="btnPhoto" class="chip" style="min-width:0;font-size:14px;padding:6px 10px" onclick="$('camFile').click()">📸 사진 찍어서 스캔</button>
    <button class="chip" style="min-width:0;font-size:14px;padding:6px 10px" onclick="soundTest()">🔊 소리 테스트</button>
    <input id="camFile" type="file" accept="image/*" capture="environment" hidden onchange="photoScan(this)">

  <div id="keypad" hidden><div class="kpbox">
    <div class="small" id="kpTitle">작품 번호를 입력하세요</div>

<!-- 5. 부하테스트 -->
<section id="vTest" hidden>

</section>

<div id="gate" hidden><div class="gbox">
  <div class="gt">🔒 선생님 확인</div><div class="gs">처음 화면으로 돌아가려면 운영 PIN을 입력하세요</div>

  <div class="gb"><button onclick="closeGate()" style="background:#8a93a6">취소</button><button onclick="gateOk()" style="background:#3b5bfd">처음 화면으로</button></div>
</div></div>
<div id="bal" hidden onclick="hideBal()"></div>
<div id="toasts"></div>
<div id="qbadge" hidden></div>
<div id="banner" hidden onclick="hideBanner()"><div id="bannerMsg"></div><div class="bsub">화면을 누르면 닫힙니다</div></div>

var kpMode = '', busy = false, lastText = '', lastAt = 0, pendingId = '', kpNo = '', kpTimer = null, undoTx = '', undoTimer = null, seq = 0, actx = null;

function $(id) { return document.getElementById(id); }
function show(id) { ['vPin','vMenu','vSetup','vRun','vTest'].forEach(function (v) { $(v).hidden = (v !== id); }); }
function fmt(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* ---------- PIN ---------- */
function unlock() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  pin = $('pin').value.trim();
  if (!pin) return;
  $('pinMsg').innerText = '확인 중...';
  google.script.run.withSuccessHandler(function (r) {
    if (!r.ok) { $('pinMsg').innerText = r.msg; return; }
    boot = r; $('pinMsg').innerText = ''; $('pin').value = ''; showMenu(); flushQ();
  }).withFailureHandler(function (e) { $('pinMsg').innerText = '서버 연결 실패: ' + e.message; }).bootstrap(pin);
}

function showMenu() {
  show('vMenu'); $('modeLabel').innerText = '';
  var st = boot.status, off = (st.all !== '열림');
  function setBtn(id, label, flag) { var b = $(id); var open = !off && flag === '열림'; b.disabled = !open; b.innerText = label + (open ? '' : ' (닫힘)'); }
  setBtn('mWork', '학술제 작품 좋아요', st.work);
  setBtn('mEnter', '발표장 입장', st.hall);
  setBtn('mExit', '발표장 퇴장', st.hall);
  setBtn('mBooth', '학급 부스', st.booth);
  setBtn('mSuper', '슈퍼챗', st.sup);
  setBtn('mWage', '근로 지급 (선생님용)', st.wage);
  $('mTest').hidden = !boot.testAllowed;
}

function goHome() { hideBal(); stopCam(); clearTimeout(kpTimer); $('keypad').hidden = true; busy = false; showMenu(); }

/* ---------- 모드 선택 ---------- */
function pickMode(m) {
  mode = m; target = {}; busy = false;
  if (m === 'test') { show('vTest'); $('modeLabel').innerText = '· 부하테스트'; return; }
  if (m === 'work') {
    var zs = zoneList();
    if (!zs.length) { $('modeLabel').innerText = '· 작품 좋아요'; startRun(); return; }
    var zl = $('setupList'); zl.innerHTML = '';
    $('setupTitle').innerText = '이 태블릿은 어느 구역입니까?';
    zs.forEach(function (z) {
      addChip(zl, z.name, z.count + '개 (' + z.min + '~' + z.max + '번)', function () { target = { zone: z.name }; $('modeLabel').innerText = '· 작품 좋아요 ' + z.name; startRun(); });
    });
    show('vSetup'); return;
  }
  if (m === 'balance') { $('modeLabel').innerText = '· 잔액 확인'; startRun(); return; }
  if (m === 'super') { $('modeLabel').innerText = '· 슈퍼챗'; startRun(); return; }
  if (m === 'wage') { $('modeLabel').innerText = '· 근로 지급'; startRun(); return; }
  var list = $('setupList'); list.innerHTML = '';
  if (m === 'enter' || m === 'exit') {
    $('setupTitle').innerText = '어느 발표입니까?';
    boot.sessions.filter(function (s) { return s.open; }).forEach(function (s) {
      addChip(list, s.name, '', function () { target = { session: s.code, label: s.name }; $('modeLabel').innerText = (m === 'enter' ? '· 입장 ' : '· 퇴장 ') + s.name; startRun(); });
    });
    if (!list.children.length) list.innerHTML = '<div class="small">열려 있는 발표가 없습니다. (시트 [발표] 상태 확인)</div>';
  } else if (m === 'booth') {
    $('setupTitle').innerText = '어느 부스입니까?';
    var names = [];
    boot.booths.forEach(function (b) { if (names.indexOf(b.booth) < 0) names.push(b.booth); });
    names.forEach(function (n) { addChip(list, n, '', function () { target = { booth: n, program: '' }; $('modeLabel').innerText = '· 부스 ' + n; startRun(); }); });
    if (!names.length) list.innerHTML = '<div class="small">등록된 부스가 없습니다. (시트 [부스] 확인)</div>';
  }
  show('vSetup');
}
// 작품 시트의 '구역'별 목록 (구역이 하나도 없으면 빈 배열 → 번호 입력 방식)
function zoneList() {
  var zs = {};
  Object.keys(boot.works).forEach(function (no) {
    var z = boot.works[no].zone; if (!z) return;
    var n = parseInt(no, 10);
    if (!zs[z]) zs[z] = { name: z, count: 0, min: n, max: n };
    zs[z].count++; if (n < zs[z].min) zs[z].min = n; if (n > zs[z].max) zs[z].max = n;
  });
  return Object.keys(zs).map(function (k) { return zs[k]; }).sort(function (a, b) { return a.min - b.min; });
}
function addChip(parent, text, sub, fn) {
  var b = document.createElement('button'); b.className = 'chip'; b.innerHTML = text + (sub ? '<small>' + sub + '</small>' : ''); b.onclick = fn; parent.appendChild(b); return b;
}

/* ---------- 작동 화면 ---------- */
function startRun() {
  show('vRun'); renderCfg(); setResult('wait', '카메라 켜는 중...');
  $('keypad').hidden = true; $('btnUndo').hidden = true;
  startCam();
}

function renderCfg() {
  var cfg = $('cfg'), box = $('cfgBtns'); box.innerHTML = '';
  if (mode === 'balance') cfg.innerText = '내 QR을 카메라에 보여주세요 → 내 코인이 나옵니다 (조회만 되고 코인은 바뀌지 않아요)';
  if (mode === 'work') {
    cfg.innerText = target.zone
      ? target.zone + ': ① 학생 QR 스캔 → ② 좋아요할 작품 선택 → ③ 좋아요 ♥'
      : '① 학생 QR 스캔 → ② 작품 번호 입력 → ③ 좋아요 ♥';
  } else if (mode === 'enter' || mode === 'exit') {
    cfg.innerText = (mode === 'enter' ? '입장' : '퇴장') + ' 스캔: ' + target.label;
  } else if (mode === 'booth') {
    cfg.innerText = '프로그램을 먼저 선택하고, 학생 QR을 스캔하세요.';
    boot.booths.filter(function (b) { return b.booth === target.booth; }).forEach(function (b) {
      var c = addChip(box, b.program, fmt(b.price) + 'C', function () { target.program = b.program; renderCfg(); });
      if (target.program === b.program) c.classList.add('sel');
    });
  } else if (mode === 'wage') {
    cfg.innerText = '업무를 먼저 선택하고, 일을 마친 학생의 QR을 스캔하세요. (선택한 업무의 코인이 입금됩니다)';
    boot.tasks.forEach(function (t) {
      var c = addChip(box, t.name, '+' + fmt(t.pay) + 'C', function () { target.task = t.name; renderCfg(); });
      if (target.task === t.name) c.classList.add('sel');
    });
    if (!boot.tasks.length) box.innerHTML = '<div class="small">등록된 업무가 없습니다. (시트 [근로] 확인)</div>';
  } else if (mode === 'super') {
    cfg.innerText = '① 후원할 팀 선택 ② 금액 선택(또는 직접 입력) ③ 학생 QR 스캔';
    boot.teams.filter(function (t) { return t.open; }).forEach(function (t) {
      var c = addChip(box, t.no + '번', t.name, function () { target.team = t.no; target.teamName = t.name; renderCfg(); });
      if (target.team === t.no) c.classList.add('sel');
    });
    var br = document.createElement('div'); br.style.width = '100%'; box.appendChild(br);
    boot.superOptions.forEach(function (a) {
      var c = addChip(box, fmt(a) + 'C', '', function () { target.amount = a; renderCfg(); });
      if (target.amount === a) c.classList.add('sel');
    });
    var custom = target.amount && boot.superOptions.indexOf(target.amount) < 0;
    var cc = addChip(box, custom ? fmt(target.amount) + 'C' : '✏️ 직접 입력', custom ? '직접 입력 · 눌러서 변경' : '후원자가 말한 금액', function () { openAmountKeypad(); });
    if (custom) cc.classList.add('sel');
  }
}

/* ---------- 카메라 ---------- */
function startCam() {
  if (qr) return;
  try {
    qr = new Html5Qrcode('reader');
    qr.start({ facingMode: facing }, { fps: 10, aspectRatio: 1.333, qrbox: function (w, h) { var m = Math.min(w, h), q = Math.floor(m * 0.72); return { width: q, height: q }; } }, onScan, function () {})
      .then(function () { applyMirror(); setResult('', '학생 QR을 카메라에 보여주세요.'); })
      .catch(function (e) { qr = null; camFail(e); });
  } catch (e) { qr = null; camFail(e); }
}
function camFail(e) {
  var n = (e && (e.name || e.message)) ? String(e.name || '') + ' ' + String(e.message || e) : String(e || '알 수 없음');
  var hint = /NotAllowed|Permission|denied/i.test(n) ? '권한/보안 정책으로 차단됨'
    : /NotFound|Devices/i.test(n) ? '카메라 장치를 찾지 못함'
    : /NotReadable|TrackStart/i.test(n) ? '다른 앱이 카메라를 쓰는 중'
    : /Security/i.test(n) ? '보안 정책(https/iframe)으로 차단됨'
    : (typeof Html5Qrcode === 'undefined') ? '스캔 라이브러리를 불러오지 못함(인터넷 확인)' : '원인 불명';
  setResult('err', '카메라를 켤 수 없습니다.\n[' + hint + ']\n' + n.slice(0, 120) + '\n\n아래 [📸 사진 찍어서 스캔] 버튼으로 계속 사용할 수 있습니다.');
}

// 카메라 영상 스캔이 막힌 기기용: 기본 카메라 앱으로 QR을 사진 찍어 읽습니다.
function photoScan(inp) {
  var f = inp.files && inp.files[0]; inp.value = '';
  if (!f) return;
  if (typeof Html5Qrcode === 'undefined') { setResult('err', '스캔 라이브러리를 불러오지 못했습니다.\n인터넷 연결을 확인하세요.'); return; }
  setResult('wait', '사진에서 QR 읽는 중...');
  var tmp = qr || new Html5Qrcode('reader');
  tmp.scanFile(f, false).then(function (text) { lastText = ''; onScan(text); })
    .catch(function () { feedback(false); setResult('err', 'QR을 읽지 못했습니다.\nQR을 화면에 크게 담아 다시 찍어주세요.'); });
}
function stopCam() { if (qr) { var q = qr; qr = null; q.stop().then(function () { q.clear(); }).catch(function () {}); } }
// 좌우반전(거울모드): 화면 표시만 뒤집습니다. QR 인식에는 영향 없음. 전면 카메라는 기본 반전, 선택은 기기에 저장됩니다.
function mirrorOn() {
  var v = null; try { v = localStorage.getItem('mirror'); } catch (e) {}
  return v === null ? facing === 'user' : v === '1';
}
function applyMirror() { var r = document.getElementById('reader'); if (r) r.classList.toggle('mirror', mirrorOn()); }
function toggleMirror() { try { localStorage.setItem('mirror', mirrorOn() ? '0' : '1'); } catch (e) {} applyMirror(); }
function flipCam() { facing = (facing === 'environment') ? 'user' : 'environment'; try { localStorage.removeItem('mirror'); } catch (e) {} applyMirror(); stopCam(); setTimeout(startCam, 400); }

/* ---------- 스캔 ---------- */
function onScan(text) {
  var now = Date.now();
  if (busy || !$('keypad').hidden || !$('gate').hidden) return;   // 키패드(금액 입력)가 열려 있는 동안에는 스캔하지 않음
  if (text === lastText && now - lastAt < (mode === 'balance' ? 8000 : 2500)) return;
  lastText = text; lastAt = now;
  text = String(text).trim().toUpperCase();
  if (!/^[A-Z0-9]{6,12}$/.test(text)) { feedback(false); setResult('err', '학생 QR이 아닙니다.'); showBanner('err', '학생 QR이 아닙니다.'); return; }

  if (mode === 'booth' && !target.program) { feedback(false); setResult('warn', '먼저 위에서\n프로그램을 선택하세요.'); return; }
  if (mode === 'wage' && !target.task) { feedback(false); setResult('warn', '먼저 위에서\n업무를 선택하세요.'); return; }
  if (mode === 'super' && (!target.team || !target.amount)) { feedback(false); setResult('warn', '먼저 후원할 팀과\n금액을 선택하세요.'); return; }

  scanBeep(); // QR이 인식된 즉시 큰 소리
  if (mode === 'balance') { showBal(text); return; }
  if (mode === 'work') { pendingId = text; busy = true; openKeypad(); return; }
  submit(text);
}

function devLabel() {
  return mode + (target.booth ? ':' + target.booth : '') + (target.session ? ':' + target.session : '') + (target.task ? ':' + target.task : '') + (target.zone ? ':' + target.zone : '');
}
// 입장/퇴장: 결과를 기다리지 않고 다음 학생을 바로 찍을 수 있게 처리 (결과는 위쪽 알림으로 차례로 표시)
// 학생용 잔액 확인: 조회만 합니다. 6초 뒤 자동으로 지워져 다음 학생에게 앞 학생의 잔액이 보이지 않습니다.
var balTimer = null;
function showBal(id) {
  var b = $('bal'); clearTimeout(balTimer);
  b.innerHTML = '<div><div class="bn">⏳ 확인 중...</div></div>'; b.hidden = false;
  var mine = ++seq;
  google.script.run
    .withSuccessHandler(function (r) {
      if (mine !== seq) return;
      if (!r.ok) { feedback(false); b.innerHTML = '<div><div class="bn" style="font-size:44px">' + esc(r.msg) + '</div><div class="bh">화면을 터치하면 닫힙니다</div></div>'; balTimer = setTimeout(hideBal, 3000); return; }
      feedback(true);
      var rows = r.recent.map(function (x) { return '<div><span>' + esc(x.label) + '</span><span class="' + (x.delta < 0 ? 'm' : 'p') + '">' + (x.delta > 0 ? '+' : '') + fmt(x.delta) + 'C</span></div>'; }).join('');
      b.innerHTML = '<div><div class="bn">' + esc(r.name) + '님의 잔액</div><div class="bv">' + fmt(r.balance) + '<i>C</i></div>'
        + '<div class="bs">처음 ' + fmt(r.initial) + 'C · 쓴 코인 ' + fmt(r.spent) + 'C' + (r.got ? ' · 받은 코인 ' + fmt(r.got) + 'C' : '') + '</div>'
        + (rows ? '<div class="bl">' + rows + '</div>' : '<div class="bs">아직 사용 내역이 없어요</div>')
        + '<div class="bh">6초 뒤 자동으로 사라집니다 · 터치하면 닫힘</div></div>';
      balTimer = setTimeout(hideBal, 6000);
    })
    .withFailureHandler(function () { if (mine !== seq) return; feedback(false); b.innerHTML = '<div><div class="bn" style="font-size:40px">통신 오류<br>잠시 후 다시 찍어 주세요</div></div>'; balTimer = setTimeout(hideBal, 3000); })
    .balance(pin, id);
}
function hideBal() { clearTimeout(balTimer); $('bal').hidden = true; }
// [처음] 버튼은 없습니다(학생이 누르는 것 방지). 선생님은 상단 제목줄을 5번 연속 터치 → PIN 입력 → 처음 화면으로.
var hdrTaps = 0, hdrT = null, gateT = null;
document.querySelector('header').addEventListener('click', function () {
  if (!pin || !$('vPin').hidden) return;
  hdrTaps++; clearTimeout(hdrT); hdrT = setTimeout(function () { hdrTaps = 0; }, 2500);
  if (hdrTaps >= 5) { hdrTaps = 0; openGate(); }
});
function openGate() { $('gate').hidden = false; $('gpin').value = ''; $('gmsg').innerText = ''; setTimeout(function () { $('gpin').focus(); }, 50); clearTimeout(gateT); gateT = setTimeout(closeGate, 25000); }
function closeGate() { clearTimeout(gateT); $('gate').hidden = true; $('gpin').value = ''; }
function gateOk() {
  if ($('gpin').value.trim() === pin) { closeGate(); goHome(); }
  else { $('gmsg').innerText = 'PIN이 달라요'; $('gpin').value = ''; }
}

function submitPipe(id) {
  var qid = newQid(), req = { mode: mode, studentId: id, target: payload(), device: devLabel(), qid: qid, ts: Date.now() };
  var el = toast('wait', '⏳ ' + (nameOf(id) ? nameOf(id) + '님 ' : '') + '확인 중...'), done = false;
  function toQueue(why) {
    if (done) return; done = true; clearTimeout(timer);
    qAdd(req);
    var nm = (boot && boot.students && boot.students[id]) || '';
    announce({ level: 'ok', _say: '임시저장' }, id);
    setToast(el, 'warn', (nm ? nm + '님 ' : '') + '임시 저장됨 📥\n' + why + ' — 연결되면 자동 전송');
  }
  // 연결이 끊겼거나 10초 안에 응답이 없으면 기기에 임시 저장 (같은 요청ID라 나중에 중복 처리되지 않음)
  var timer = setTimeout(function () { toQueue('응답 지연'); }, 10000);
  if (navigator.onLine === false) { toQueue('오프라인'); return; }
  google.script.run
    .withSuccessHandler(function (r) { clearTimeout(timer); qRemove(qid); if (done) return; done = true; announce(r, id); setToast(el, r.level, r.msg); })
    .withFailureHandler(function () { toQueue('통신 끊김'); })
    .processScan({ pin: pin, mode: req.mode, studentId: id, target: req.target, device: req.device, qid: qid, ts: req.ts });
}

/* ---------- 오프라인 임시저장 대기열 (입장/퇴장 전용) ---------- */
var Q_KEY = 'coinQ', Q = [], flushing = false;
try { Q = JSON.parse(localStorage.getItem(Q_KEY) || '[]') || []; } catch (e) { Q = []; }
function newQid() { var r = ''; for (var i = 0; i < 5; i++) r += Math.floor(Math.random() * 36).toString(36); return ('Q' + Date.now().toString(36) + r).toUpperCase(); }
function qSave() { try { localStorage.setItem(Q_KEY, JSON.stringify(Q)); } catch (e) {} qBadge(); }
function qAdd(it) { Q.push(it); qSave(); }
function qRemove(qid) { var n = Q.length; Q = Q.filter(function (x) { return x.qid !== qid; }); if (Q.length !== n) qSave(); }
function qBadge() {
  var b = $('qbadge'), off = (navigator.onLine === false);
  if (!Q.length && !off) { b.hidden = true; return; }
  b.hidden = false; b.className = off ? 'off' : '';
  b.innerText = (off ? '📴 오프라인 · ' : '📤 ') + (Q.length ? '임시저장 ' + Q.length + '건' + (off ? '' : ' 전송 대기') : '연결 끊김');
}
function flushQ() {
  if (flushing || !Q.length || !pin || navigator.onLine === false) return;
  flushing = true;
  var batch = Q.slice(0, 15);
  batch.forEach(function (it) { if ((it.tries || 0) >= 20) it.final = true; });
  var guard = setTimeout(function () { flushing = false; }, 60000);
  google.script.run
    .withSuccessHandler(function (r) {
      clearTimeout(guard); flushing = false;
      if (!r || !r.ok) { toast('err', (r && r.msg) || '임시저장 전송 실패'); return; }
      var by = {}, okN = 0, badN = 0, removed = 0;
      (r.results || []).forEach(function (x) { by[x.qid] = x; });
      batch.forEach(function (it) {
        var x = by[it.qid]; if (!x) return;
        if (x.retry) { it.tries = (it.tries || 0) + 1; return; }
        qRemove(it.qid); removed++;
        if (x.ok || /이미/.test(x.msg || '')) okN++; else badN++;
      });
      qSave();
      if (okN || badN) toast(badN ? 'warn' : 'ok', '임시저장 ' + (okN + badN) + '건 전송 완료' + (badN ? '\n확인 필요 ' + badN + '건 → [동기화실패] 시트' : ''));
      if (removed && Q.length) setTimeout(flushQ, 500);
    })
    .withFailureHandler(function () { clearTimeout(guard); flushing = false; qBadge(); })
    .syncBatch(pin, batch);
}
window.addEventListener('online', function () { qBadge(); setTimeout(flushQ, 1500); });
window.addEventListener('offline', qBadge);
window.addEventListener('beforeunload', function (e) { if (Q.length) { e.preventDefault(); e.returnValue = ''; } });
setInterval(flushQ, 15000);
// 서버가 식어서 느려지는 것을 막기 위해 4분마다 가볍게 깨워 둡니다
setInterval(function () { if (pin && navigator.onLine !== false) { try { google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {}).ping(); } catch (e) {} } }, 240000);
qBadge();
var toastSeq = 0;
function toast(level, msg) {
  var box = $('toasts'), el = document.createElement('div'); el.id = 't' + (++toastSeq);
  box.insertBefore(el, box.firstChild); setToast(el, level, msg);
  while (box.children.length > 4) box.removeChild(box.lastChild);
  return el;
}
function setToast(el, level, msg) {
  el.className = 'toast ' + level; el.innerHTML = '';
  String(msg).split('\n').forEach(function (line, i) {
    if (!line) return;
    var d = document.createElement('div'); d.className = i === 0 ? 't1' : 't2'; d.textContent = line; el.appendChild(d);
  });
  clearTimeout(el._t);
  if (level !== 'wait') el._t = setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, level === 'ok' ? 2200 : 3500);
}

var pendingLast = '';
function submit(id) {
  pendingLast = id;
  if (mode === 'enter' || mode === 'exit') { submitPipe(id); return; }
  busy = true; hideUndo(); setResult('wait', (nameOf(id) ? nameOf(id) + '님 ' : '') + '처리 중... ⏳');
  var my = ++seq, done = false;
  var label = devLabel();
  var timer = setTimeout(function () { if (!done) { done = true; busy = false; feedback(false); setResult('warn', '응답이 늦습니다.\n결제가 되었는지 [거래내역]을 확인하고\n필요하면 다시 스캔하세요.'); } }, 25000);
  google.script.run
    .withSuccessHandler(function (r) { if (done || my !== seq) return; done = true; clearTimeout(timer); onResult(r); })
    .withFailureHandler(function (e) { if (done || my !== seq) return; done = true; clearTimeout(timer); busy = false; feedback(false); setResult('err', '통신 오류\n결제가 되었는지 확인 후\n다시 스캔하세요.\n(이 모드는 오프라인 저장이 안 됩니다)'); showBanner('err', '통신 오류\n처리가 되었는지 확인 후\n다시 스캔하세요.'); })
    .processScan({ pin: pin, mode: mode, studentId: id, target: payload(), device: label });
}
function payload() {
  if (mode === 'work') return { no: kpNo, zone: target.zone || '' };
  if (mode === 'booth') return { booth: target.booth, program: target.program };
  if (mode === 'super') return { team: target.team, amount: target.amount };
  if (mode === 'wage') return { task: target.task };
  return { session: target.session };
}
function onResult(r) {
  announce(r, pendingLast);
  setResult(r.level, r.msg);
  showBanner(r.level, r.msg);
  if (r.level === 'ok' && r.undo && r.txId) { undoTx = r.txId; $('btnUndo').hidden = false; clearTimeout(undoTimer); undoTimer = setTimeout(hideUndo, 20000); }
  setTimeout(function () { busy = false; lastText = ''; }, 600);
}
function hideUndo() { $('btnUndo').hidden = true; undoTx = ''; clearTimeout(undoTimer); }
function undo() {
  if (!undoTx) return;
  var tx = undoTx; hideUndo(); busy = true; setResult('wait', '취소 처리 중...');
  google.script.run.withSuccessHandler(function (r) { feedback(r.level === 'ok'); setResult(r.level, r.msg); showBanner(r.level, r.msg); setTimeout(function () { busy = false; lastText = ''; }, 1800); })
    .withFailureHandler(function () { busy = false; setResult('err', '통신 오류. 다시 시도하세요.'); })
    .cancelTx({ pin: pin, txId: tx });
}

/* ---------- 작품 번호 키패드 ---------- */
// 슈퍼챗 금액 직접 입력용 (같은 키패드를 재사용)
function openAmountKeypad() {
  kpMode = 'amount'; kpNo = ''; pendingId = '';
  $('wgrid').hidden = true; $('keys').hidden = false; $('kpDisp').hidden = false;
  $('kpTitle').innerText = '후원 금액을 입력하세요'; $('kpOk').innerText = '금액 정하기';
  renderKp(); $('keypad').hidden = false;
  clearTimeout(kpTimer); kpTimer = setTimeout(kpCancel, 30000);
}
function openKeypad() {
  kpMode = ''; $('kpOk').innerText = '좋아요 ♥';
  kpNo = '';
  var zmode = !!target.zone;
  $('wgrid').hidden = !zmode; $('keys').hidden = zmode; $('kpDisp').hidden = zmode;
  $('kpTitle').innerText = zmode ? '좋아요할 작품을 선택하세요' : '작품 번호를 입력하세요';
  if (zmode) buildGrid();
  renderKp(); $('keypad').hidden = false; setResult('ok', (nameOf(pendingId) ? nameOf(pendingId) + '님 ' : '') + 'QR 인식 완료 ✔');
  clearTimeout(kpTimer); kpTimer = setTimeout(kpCancel, 30000);
}
function buildGrid() {
  var g = $('wgrid'); g.innerHTML = '';
  Object.keys(boot.works).map(function (n) { return parseInt(n, 10); }).sort(function (a, b) { return a - b; }).forEach(function (n) {
    var w = boot.works[String(n)]; if (w.zone !== target.zone) return;
    var b = document.createElement('button'); b.className = 'wbtn'; b.setAttribute('data-no', String(n));
    var num = document.createElement('b'); num.textContent = n + '.'; b.appendChild(num); b.appendChild(document.createTextNode(' ' + w.name));
    b.onclick = function () {
      kpNo = String(n);
      Array.prototype.forEach.call(g.children, function (x) { x.classList.toggle('sel', x === b); });
      renderKp(); clearTimeout(kpTimer); kpTimer = setTimeout(kpCancel, 30000);
    };
    g.appendChild(b);
  });
}
function kp(k) {
  if (k === 'C') kpNo = ''; else if (k === 'B') kpNo = kpNo.slice(0, -1); else if (kpNo.length < 5) kpNo += k;
  renderKp(); clearTimeout(kpTimer); kpTimer = setTimeout(kpCancel, 30000);
}
function renderKp() {
  if (kpMode === 'amount') {
    var a = parseInt(kpNo, 10) || 0, mn = boot.superMin || 1, mx = boot.superMax || 0, info = $('kpInfo'), ok = $('kpOk');
    $('kpDisp').innerText = kpNo ? fmt(a) + 'C' : '＿＿';
    var bad = !a ? '' : (a < mn ? '최소 ' + fmt(mn) + 'C' : (mx && a > mx ? '1회 최대 ' + fmt(mx) + 'C' : ''));
    info.innerHTML = bad ? '❌ ' + bad : (a ? '이 금액으로 후원합니다' : ''); info.style.color = bad ? '#c62828' : '#1b7a2b';
    ok.disabled = !a || !!bad; ok.style.opacity = ok.disabled ? .4 : 1; return;
  }
  $('kpDisp').innerText = kpNo ? kpNo + '번' : '＿＿';
  var w = kpNo ? boot.works[String(parseInt(kpNo, 10))] : null, info = $('kpInfo'), ok = $('kpOk');
  if (!kpNo) { info.innerText = ''; ok.disabled = true; ok.style.opacity = .4; }
  else if (!w) { info.innerText = '❌ 없는 작품 번호입니다'; info.style.color = '#c62828'; ok.disabled = true; ok.style.opacity = .4; }
  else { var lk = boot.like || {}; info.innerHTML = '<b>' + esc(w.name) + '</b><br>❤ 좋아요 → ' + (lk.coin ? '+' + fmt(lk.coin) + 'C 받아요' : '코인 없음'); info.style.color = '#d6336c'; ok.disabled = false; ok.style.opacity = 1; }
}
function kpCancel() { clearTimeout(kpTimer); $('keypad').hidden = true; pendingId = ''; busy = false; lastText = ''; if (kpMode === 'amount') { kpMode = ''; $('kpOk').innerText = '좋아요 ♥'; return; } setResult('', '취소되었습니다. 학생 QR을 다시 보여주세요.'); }
function kpSend() {
  if (kpMode === 'amount') {
    var a = parseInt(kpNo, 10) || 0, mn = boot.superMin || 1, mx = boot.superMax || 0;
    if (!a || a < mn || (mx && a > mx)) return;
    clearTimeout(kpTimer); $('keypad').hidden = true; kpMode = ''; $('kpOk').innerText = '좋아요 ♥'; target.amount = a; renderCfg(); return;
  }
  if (!kpNo || !boot.works[String(parseInt(kpNo, 10))]) return;
  clearTimeout(kpTimer); $('keypad').hidden = true; var id = pendingId; pendingId = ''; submit(id);
}

/* ---------- 화면/소리 ---------- */
var bannerTimer = null;
function showBanner(level, msg) {
  var b = $('banner'), box = $('bannerMsg'); box.innerHTML = '';
  String(msg).split('\n').forEach(function (line, i) {
    if (!line) return;
    var d = document.createElement('div'); d.className = i === 0 ? 'b1' : 'b2'; d.textContent = line; box.appendChild(d);
  });
  b.className = level === 'ok' ? 'ok' : (level === 'warn' ? 'warn' : 'err');
  b.hidden = false;
  clearTimeout(bannerTimer); bannerTimer = setTimeout(hideBanner, level === 'ok' ? 1200 : 2200);
}
function hideBanner() { $('banner').hidden = true; clearTimeout(bannerTimer); }
function setResult(cls, msg) { var r = $('result'); r.className = cls || ''; r.innerText = msg; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
// 소리: 모든 QR 인식/결과에 반드시 소리가 나도록, 일시정지된 오디오를 매번 깨운 뒤 재생합니다.
function playTones(tones) {
  try { if (navigator.vibrate) navigator.vibrate(tones.vib); } catch (e) {}
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var go = function () {
      var t = actx.currentTime;
      tones.list.forEach(function (n) {
        var o = actx.createOscillator(), g = actx.createGain(); o.type = n.type || 'square'; o.frequency.value = n.f; g.gain.value = 0.5;
        o.connect(g); g.connect(actx.destination); o.start(t + n.at); o.stop(t + n.at + n.dur);
      });
    };
    if (actx.state !== 'running') actx.resume().then(go, go); else go();
  } catch (e) {}
}
// QR이 인식된 즉시: 삑삑
function scanBeep() { playTones({ vib: 60, list: [{ f: 1500, at: 0, dur: 0.1 }, { f: 1500, at: 0.16, dur: 0.1 }] }); }
// 결과: 성공=띠링(올라가는 소리), 실패/경고=낮고 긴 부저
function feedback(ok) {
  playTones(ok ? { vib: 80, list: [{ f: 1000, at: 0, dur: 0.1, type: 'sine' }, { f: 1500, at: 0.11, dur: 0.16, type: 'sine' }] }
               : { vib: [120, 60, 120], list: [{ f: 260, at: 0, dur: 0.4 }] });
}

/* ---------- 음성 안내 (기기에 내장된 한국어 음성 사용, 인터넷 불필요) ---------- */
function nameOf(id) { return (boot && boot.students && id && boot.students[String(id).toUpperCase()]) || ''; }
var koVoice = null;
function pickVoice() {
  if (koVoice) return koVoice;
  try {
    var vs = speechSynthesis.getVoices().filter(function (v) { return /^ko/i.test(v.lang); });
    if (!vs.length) return null;
    var pref = vs.filter(function (v) { return /google|yuna|sun-?hi|heami|seoyeon|natural|online/i.test(v.name); });
    koVoice = (pref[0] || vs[0]); return koVoice;
  } catch (e) { return null; }
}
try { speechSynthesis.onvoiceschanged = function () { koVoice = null; pickVoice(); }; speechSynthesis.getVoices(); } catch (e) {}
function speak(key, name, rawText) {
  var v = boot && boot.voice; if (!v || v.mode === '삑' || v.mode === '무음') return;
  var txt = rawText || String((v.say && v.say[key]) || '');
  txt = txt.replace(/\{이름\}/g, name || '').trim();
  if (!txt) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(txt); u.lang = 'ko-KR'; u.rate = v.rate || 1.05; u.pitch = 1.05; u.volume = 1;
    var vo = pickVoice(); if (vo) u.voice = vo;
    setTimeout(function () { try { speechSynthesis.speak(u); } catch (e) {} }, v.mode === '둘다' ? 260 : 0);
  } catch (e) {}
}
// 결과 안내: 설정 [안내방식] = 삑 / 음성 / 둘다 / 무음
function announce(r, id) {
  var v = (boot && boot.voice) || { mode: '삑' }, ok = r.level === 'ok';
  if (v.mode !== '음성' && v.mode !== '무음') feedback(ok);
  else if (v.mode === '음성' && !ok) { /* 음성 전용이어도 실패는 낮은 부저를 함께 */ feedback(false); }
  var key;
  if (r._say) key = r._say;
  else if (r.like === 'limit') key = '한도';
  else if (r.like === 'dup') key = '중복';
  else if (!ok) key = /잔액 부족/.test(r.msg || '') ? '잔액부족' : '실패';
  else key = ({ work: '좋아요', enter: '입장', exit: '퇴장', wage: '근로', booth: '결제', super: '결제' })[mode] || '결제';
  speak(key, r.name || nameOf(id));
}
function soundTest() {
  scanBeep();
  setTimeout(function () { announce({ level: 'ok' }, ''); }, 450);
}

/* ---------- 부하테스트 (사본 전용) ---------- */
function runTest() {
  var N = parseInt($('tN').value, 10) || 100, C = parseInt($('tC').value, 10) || 5, log = $('testLog');
  var prog = boot.booths[0];
  if (!prog) { log.innerText = '[부스]에 프로그램이 1개 이상 있어야 합니다. 그리고 [설정]의 부스를 "열림"으로 바꾸세요.'; return; }
  log.innerText = '테스트 학생 ID 불러오는 중...';
  google.script.run.withSuccessHandler(function (r) {
    if (!r.ok) { log.innerText = r.msg; return; }
    var ids = r.ids; if (!ids.length) { log.innerText = '학생지갑에 ID가 없습니다.'; return; }
    var sent = 0, finished = 0, okc = 0, bad = 0, lat = [], t0 = Date.now(), msgs = {};
    function next() {
      if (sent >= N) return;
      var i = sent++, t1 = Date.now();
      google.script.run.withSuccessHandler(function (res) {
        lat.push(Date.now() - t1); if (res.ok) okc++; else { bad++; msgs[res.msg.split('\n')[0]] = (msgs[res.msg.split('\n')[0]] || 0) + 1; }
        fin();
      }).withFailureHandler(function () { lat.push(Date.now() - t1); bad++; msgs['통신실패'] = (msgs['통신실패'] || 0) + 1; fin(); })
        .processScan({ pin: pin, mode: 'booth', studentId: ids[i % ids.length], target: { booth: prog.booth, program: prog.program }, device: 'LOADTEST' });
    }
    function fin() {
      finished++; log.innerText = '진행 ' + finished + ' / ' + N + ' ...';
      if (finished < N) { next(); return; }
      var sec = (Date.now() - t0) / 1000; lat.sort(function (a, b) { return a - b; });
      var avg = lat.reduce(function (a, b) { return a + b; }, 0) / lat.length;
      var m = Object.keys(msgs).map(function (k) { return '  - ' + k + ': ' + msgs[k] + '건'; }).join('\n');
      log.innerText = '✅ 테스트 완료\n요청 ' + N + '건 / 동시 ' + C + '건\n성공 ' + okc + ' · 실패/거절 ' + bad + '\n평균 응답 ' + (avg / 1000).toFixed(2) + '초\n상위5%(느린 쪽) ' + (lat[Math.floor(lat.length * 0.95)] / 1000).toFixed(2) + '초\n최대 ' + (lat[lat.length - 1] / 1000).toFixed(2) + '초\n초당 처리량 ' + (N / sec).toFixed(2) + '건/초\n총 ' + sec.toFixed(1) + '초' + (m ? '\n거절 사유:\n' + m : '');
    }
    for (var c = 0; c < Math.min(C, N); c++) next();
  }).withFailureHandler(function (e) { log.innerText = '오류: ' + e.message; }).getTestIds(pin, N);
}
