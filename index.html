<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="./html5-qrcode.min.js"></script>
<script>if(typeof Html5Qrcode==='undefined'){document.write('<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"><\/script>');}</script>
<style>
/* ===== 문화코인 태블릿 화면 · 디자인 시스템 ===== */
:root {
  --ink: #131a2e; --ink2: #3d4763; --muted: #7a849e; --line: #e4e8f2; --bg: #f2f4fb; --card: #fff;
  --brand: #4f46e5; --brand2: #7c3aed;
  --ok: #12a363; --ok-bg: #e9f9f1; --warn: #d97706; --warn-bg: #fff6e5; --err: #dc2626; --err-bg: #fff0f0; --info: #0284c7; --info-bg: #e8f5ff; --like: #db2777; --like-bg: #fff0f7;
  --shadow: 0 10px 30px rgba(31, 41, 90, .12); --shadow-s: 0 2px 8px rgba(31, 41, 90, .08);
  --camPad: 0px;   /* 카메라가 아직 아래로 잘리면 이 값을 키우세요 (예: 40px). 카메라가 너무 작으면 줄이세요 */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(900px 500px at 80% -10%, #e4e1ff 0%, transparent 60%), var(--bg); color: var(--ink);
  font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif; -webkit-user-select: none; user-select: none; text-align: center; overflow-x: hidden; }
[hidden] { display: none !important; }
button { font-family: inherit; cursor: pointer; }

/* 상단 바 */
header { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: #fff;
  background: linear-gradient(100deg, #1e1b4b, #3730a3 60%, #5b21b6); box-shadow: 0 4px 18px rgba(30, 27, 75, .35); text-align: left; }
header .brand { display: flex; align-items: center; gap: 8px; font-size: 19px; letter-spacing: -.01em; }
header .logo { width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,.16); display: inline-flex; align-items: center; justify-content: center; font-size: 19px; }
#modeLabel { font-size: 14px; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.16); max-width: 55vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#modeLabel:empty { display: none; }
#qbadge { margin-left: auto; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; color: #fff; background: #ea580c; }
#qbadge.off { background: #dc2626; }

section { padding: 16px; }
.title { font-size: 20px; font-weight: 800; letter-spacing: -.01em; color: var(--ink); margin: 6px 0 14px; }
.small { font-size: 14px; color: var(--muted); }

/* PIN */
#vPin { max-width: 440px; margin: 7vh auto 0; background: var(--card); border-radius: 28px; padding: 34px 26px 30px; box-shadow: var(--shadow); }
#vPin .hero { width: 76px; height: 76px; border-radius: 24px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 40px;
  background: linear-gradient(135deg, #fbbf24, #f59e0b); box-shadow: 0 10px 24px rgba(245, 158, 11, .4); }
#vPin h1 { margin: 6px 0 2px; font-size: 26px; letter-spacing: -.02em; } #vPin p { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
input.pin { width: 100%; font-size: 28px; padding: 14px; text-align: center; letter-spacing: 8px; border-radius: 16px; border: 2px solid var(--line); background: #f7f8fd; font-family: inherit; }
input.pin:focus { outline: none; border-color: var(--brand); background: #fff; box-shadow: 0 0 0 4px rgba(79, 70, 229, .15); }
.btn { width: 100%; margin-top: 14px; padding: 16px; font-size: 19px; font-weight: 800; color: #fff; border: 0; border-radius: 16px; background: linear-gradient(135deg, var(--brand), var(--brand2)); box-shadow: 0 8px 20px rgba(79, 70, 229, .35); }
.btn:active { transform: translateY(1px); }
#pinMsg { min-height: 22px; margin-top: 10px; color: var(--err); font-weight: 700; font-size: 15px; }

/* 역할 선택 */
#vMenu { max-width: 940px; margin: 0 auto; padding: 18px 16px 30px; }
#vMenu .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.mode { position: relative; display: flex; align-items: center; gap: 16px; text-align: left; padding: 18px 18px; border: 0; border-radius: 22px; background: var(--card); color: var(--ink); box-shadow: var(--shadow-s); border: 1px solid var(--line); transition: transform .08s, box-shadow .2s; }
.mode:active { transform: scale(.985); }
.mode .ic { flex: none; width: 62px; height: 62px; border-radius: 19px; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #fff; background: var(--c, #6366f1); box-shadow: 0 8px 18px color-mix(in srgb, var(--c, #6366f1) 45%, transparent); }
.mode .tx b { display: block; font-size: 20px; letter-spacing: -.01em; } .mode .tx small { display: block; margin-top: 3px; color: var(--muted); font-size: 14px; font-weight: 500; }
.mode .tag { position: absolute; right: 14px; top: 12px; font-size: 12px; font-weight: 800; color: #fff; background: #94a3b8; padding: 3px 9px; border-radius: 999px; font-style: normal; }
.mode[disabled] { background: #f1f3f9; box-shadow: none; opacity: .75; } .mode[disabled] .ic { background: #cbd2e1; box-shadow: none; filter: grayscale(1); }
.m-work { --c: #ec4899; } .m-hall { --c: #0ea5e9; } .m-booth { --c: #f97316; } .m-market { --c: #eab308; } .m-super { --c: #8b5cf6; } .m-wage { --c: #10b981; } .m-bal { --c: #4f46e5; } .m-test { --c: #64748b; }

/* 선택 칩/카드 */
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.chip { min-width: 96px; padding: 12px 16px; font-size: 18px; font-weight: 800; color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-s); }
.chip small { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; color: var(--muted); }
.chip.sel { color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand2)); border-color: transparent; box-shadow: 0 8px 18px rgba(79, 70, 229, .4); }
.chip.sel small { color: rgba(255,255,255,.85); }
#setupList { max-width: 900px; margin: 0 auto; max-height: calc(100dvh - 150px); overflow-y: auto; padding: 4px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; -webkit-overflow-scrolling: touch; }
#setupList .chip { min-width: 0; padding: 18px 14px; font-size: 19px; border-radius: 18px; }

/* 작동 화면 */
#vRun { padding: 10px 12px 0; display: flex; flex-direction: column; align-items: center; min-height: calc(100dvh - 54px); }
#cfg { font-size: 15px; font-weight: 700; color: var(--ink2); line-height: 1.4; padding: 2px 6px 8px; max-width: 760px; }
#cfgBtns { max-height: 20dvh; overflow-y: auto; margin-bottom: 8px; padding: 2px; max-width: 900px; -webkit-overflow-scrolling: touch; }
#cfgBtns .chip { padding: 9px 14px; font-size: 16px; min-width: 0; border-radius: 14px; }
#stage { position: relative; display: flex; justify-content: center; width: 100%; }
#reader { width: 80vw; min-height: 200px; border-radius: 26px; overflow: hidden; background: #0b1020; border: 0; outline: 5px solid #fff; box-shadow: 0 14px 34px rgba(25, 30, 80, .35); }
#reader video { width: 100% !important; height: auto !important; display: block; }
#reader.mirror video { transform: scaleX(-1); }
#tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 12px 0 14px; width: 100%; }
#tools .tb { font-size: 13px; font-weight: 700; padding: 8px 13px; border: 0; border-radius: 999px; color: #475069; background: #e7eaf5; }
#btnUndo { font-size: 14px; font-weight: 800; padding: 9px 16px; border: 0; border-radius: 999px; color: #fff; background: linear-gradient(135deg, #fb923c, #ea580c); box-shadow: 0 6px 14px rgba(234, 88, 12, .4); }
#result { max-width: 640px; margin: 8px auto 0; padding: 10px 16px; border-radius: 14px; background: rgba(255,255,255,.75); color: var(--ink2); font-size: 15px; font-weight: 700; white-space: pre-line; line-height: 1.4; }
#result:empty { display: none; }
#result.err { color: var(--err); background: var(--err-bg); } #result.warn { color: var(--warn); background: var(--warn-bg); } #result.ok { color: var(--ok); background: var(--ok-bg); }

/* 결과 팝업 */
#pop { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(15, 20, 45, .46); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fade .15s; }
#pop .pc { position: relative; width: min(92vw, 520px); background: var(--card); border-radius: 32px; padding: 30px 26px 26px; text-align: center; box-shadow: 0 24px 60px rgba(10, 14, 40, .45); overflow: hidden; animation: pin .22s cubic-bezier(.2, .9, .3, 1.2); }
#pop .pc::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 10px; background: var(--ac); }
#pop .pi { width: 92px; height: 92px; margin: 0 auto 10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 48px; background: var(--abg); }
#pop .pt { font-size: 28px; font-weight: 900; letter-spacing: -.02em; color: var(--ac); }
#pop .pn { margin-top: 6px; font-size: 22px; font-weight: 800; color: var(--ink); }
#pop .pa { margin: 10px 0 2px; font-size: 76px; line-height: 1.05; font-weight: 900; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
#pop .pa i { font-style: normal; font-size: .42em; margin-left: .12em; opacity: .8; } #pop .pa.neg { color: #e11d48; } #pop .pa.pos { color: var(--ok); }
#pop .pm { margin-top: 8px; font-size: 18px; font-weight: 600; color: var(--ink2); line-height: 1.45; }
#pop .pb { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; padding: 14px 20px; border-radius: 18px; background: #f4f6fc; font-size: 18px; font-weight: 700; color: var(--muted); }
#pop .pb b { font-size: 34px; color: var(--ink); font-variant-numeric: tabular-nums; } #pop .pb b i { font-style: normal; font-size: .55em; margin-left: .1em; }
#pop .plike { margin-top: 14px; width: 100%; padding: 15px; border: 0; border-radius: 18px; font-size: 20px; font-weight: 900; color: #fff; background: linear-gradient(135deg, #f472b6, #db2777); box-shadow: 0 10px 22px rgba(219, 39, 119, .38); }
#pop .pbar { position: absolute; left: 0; bottom: 0; height: 6px; width: 100%; background: var(--ac); opacity: .35; transform-origin: left; animation: bar linear forwards; }
#pop .spin { width: 54px; height: 54px; border-radius: 50%; border: 6px solid #dfe3f5; border-top-color: var(--brand); animation: rot .8s linear infinite; }
#pop.ok { --ac: var(--ok); --abg: var(--ok-bg); } #pop.warn { --ac: var(--warn); --abg: var(--warn-bg); } #pop.err { --ac: var(--err); --abg: var(--err-bg); }
#pop.info { --ac: var(--info); --abg: var(--info-bg); } #pop.like { --ac: var(--like); --abg: var(--like-bg); } #pop.wait { --ac: var(--brand); --abg: #eceaff; }
@keyframes fade { from { opacity: 0; } } @keyframes pin { from { transform: scale(.88); opacity: 0; } } @keyframes bar { to { transform: scaleX(0); } } @keyframes rot { to { transform: rotate(360deg); } }

/* 키패드(작품·금액) */
#keypad { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 10px; background: rgba(15, 20, 45, .55); backdrop-filter: blur(3px); }
.kpbox { width: min(96vw, 760px); max-height: 96dvh; overflow: auto; background: var(--card); border-radius: 30px; padding: 20px 18px 18px; box-shadow: 0 24px 60px rgba(10, 14, 40, .45); }
#kpTitle { font-size: 21px; font-weight: 900; color: var(--ink); } #kpSub { margin-top: 2px; font-size: 15px; font-weight: 700; color: var(--brand); min-height: 20px; }
#kpDisp { font-size: 60px; font-weight: 900; margin: 8px 0 2px; min-height: 72px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
#kpInfo { font-size: 20px; font-weight: 700; min-height: 34px; color: var(--ink2); margin: 2px 0 8px; line-height: 1.35; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 6px auto 8px; max-width: 460px; }
.keys button { font-size: 36px; font-weight: 800; padding: 16px 0; border-radius: 18px; border: 0; background: #eef0fa; color: var(--ink); box-shadow: 0 3px 0 #d8dcee; } .keys button:active { background: #dfe3f6; transform: translateY(2px); box-shadow: none; }
.row2 { display: flex; gap: 12px; margin-top: 12px; } .row2 button { flex: 1; font-size: 22px; font-weight: 900; padding: 18px; border-radius: 18px; border: 0; color: #fff; }
#kpCancel { background: #8b93a8; } #kpOk { background: linear-gradient(135deg, #f472b6, #db2777); box-shadow: 0 8px 18px rgba(219, 39, 119, .35); } #kpOk:disabled { opacity: .4; box-shadow: none; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; max-height: 46dvh; overflow-y: auto; margin: 10px 0; padding: 2px; text-align: left; -webkit-overflow-scrolling: touch; }
.wbtn { font-size: 19px; font-weight: 700; padding: 14px 14px; border: 2px solid var(--line); border-radius: 16px; background: #fff; color: var(--ink); text-align: left; line-height: 1.3; box-shadow: var(--shadow-s); }
.wbtn b { display: inline-block; min-width: 2.2em; color: var(--like); }
.wbtn.sel { color: #fff; border-color: transparent; background: linear-gradient(135deg, #f472b6, #db2777); box-shadow: 0 8px 18px rgba(219, 39, 119, .4); } .wbtn.sel b { color: #fff; }

/* 알림(동기화 등) */
#toasts { position: fixed; left: 0; right: 0; top: 64px; z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 12px; }
.toast { min-width: min(92vw, 520px); padding: 12px 18px; border-radius: 16px; color: #fff; font-weight: 800; text-align: center; box-shadow: 0 10px 26px rgba(10, 14, 40, .3); }
.toast.ok { background: #12a363; } .toast.warn { background: #d97706; } .toast.err { background: #dc2626; } .toast.wait { background: #4f46e5; }
.toast .t1 { font-size: 18px; } .toast .t2 { font-size: 14px; margin-top: 2px; font-weight: 600; opacity: .95; }

/* 잔액 확인(학생용) */
#bal { position: fixed; inset: 0; z-index: 96; background: radial-gradient(800px 600px at 50% 0%, #5b3fd1, transparent 70%), linear-gradient(160deg, #1e1550, #3b2a9c 60%, #5b3fd1); color: #fff; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
#bal .bn { font-size: 34px; font-weight: 800; opacity: .92; } #bal .bv { font-size: min(22vw, 150px); font-weight: 900; line-height: 1.05; color: #ffd54a; text-shadow: 0 0 30px rgba(255,213,74,.5); font-variant-numeric: tabular-nums; }
#bal .bv i { font-style: normal; font-size: .38em; color: #fff; margin-left: .15em; } #bal .bs { font-size: 22px; margin: 10px 0 18px; opacity: .9; }
#bal .bl { max-width: 520px; margin: 0 auto; background: rgba(255,255,255,.12); border-radius: 20px; padding: 10px 18px; text-align: left; font-size: 21px; }
#bal .bl div { display: flex; justify-content: space-between; gap: 14px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.15); } #bal .bl div:last-child { border: 0; }
#bal .bl .m { color: #ff9ab8; font-weight: 800; } #bal .bl .p { color: #8dffbf; font-weight: 800; } #bal .bh { margin-top: 16px; font-size: 16px; opacity: .7; }

/* PIN 확인 창 */
#gate { position: fixed; inset: 0; z-index: 9999; background: rgba(15, 20, 40, .72); display: flex; align-items: center; justify-content: center; }
#gate .gbox { background: #fff; border-radius: 28px; padding: 28px 24px; width: min(92vw, 400px); text-align: center; box-shadow: 0 20px 56px rgba(0,0,0,.4); }
#gate .gt { font-size: 24px; font-weight: 900; } #gate .gs { color: var(--muted); font-size: 15px; margin: 6px 0 14px; } #gate #gmsg { color: var(--err); min-height: 24px; font-weight: 800; margin-top: 6px; }
#gate .gb { display: flex; gap: 10px; margin-top: 8px; } #gate .gb button { flex: 1; border: 0; color: #fff; font-size: 18px; font-weight: 800; padding: 15px 0; border-radius: 16px; }

/* 부하테스트 */
#testLog { text-align: left; white-space: pre-wrap; font-size: 15px; background: #fff; padding: 12px; border-radius: 12px; max-width: 520px; margin: 10px auto; }
.field { font-size: 16px; padding: 8px; width: 90px; text-align: center; border-radius: 10px; border: 2px solid var(--line); }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">🪙</span><b>문화코인</b></div>
  <span id="modeLabel"></span>
  <span id="qbadge" hidden></span>
</header>

<!-- 1. PIN -->
<section id="vPin">
  <div class="hero">🪙</div>
  <h1>문화코인</h1>
  <p>운영 PIN을 입력하세요</p>
  <input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter')unlock()">
  <button class="btn" onclick="unlock()">시작하기</button>
  <div id="pinMsg"></div>
</section>

<!-- 2. 역할 선택 -->
<section id="vMenu" hidden>
  <div class="title">이 태블릿의 역할을 선택하세요</div>
  <div class="grid2">
    <button class="mode m-work" id="mWork" onclick="pickMode('work')"><span class="ic">🖼️</span><span class="tx"><b>학술제 작품 좋아요</b><small>좋아요를 누르면 코인을 받아요</small></span><em class="tag" hidden></em></button>
    <button class="mode m-hall" id="mHall" onclick="pickMode('hall')"><span class="ic">🎓</span><span class="tx"><b>발표장 입·퇴장</b><small>QR 한 번으로 입장 · 외출 · 퇴장</small></span><em class="tag" hidden></em></button>
    <button class="mode m-booth" id="mBooth" onclick="pickMode('booth')"><span class="ic">🎪</span><span class="tx"><b>학급 부스</b><small>프로그램을 고르고 결제</small></span><em class="tag" hidden></em></button>
    <button class="mode m-market" id="mMarket" onclick="pickMode('market')"><span class="ic">🛍️</span><span class="tx"><b>코인 마켓</b><small>판매 금액을 입력하고 결제</small></span><em class="tag" hidden></em></button>
    <button class="mode m-super" id="mSuper" onclick="pickMode('super')"><span class="ic">💜</span><span class="tx"><b>슈퍼챗</b><small>장기자랑 팀 후원</small></span><em class="tag" hidden></em></button>
    <button class="mode m-wage" id="mWage" onclick="pickMode('wage')"><span class="ic">🧑‍🏫</span><span class="tx"><b>근로 지급</b><small>선생님용 · 근로 장학금</small></span><em class="tag" hidden></em></button>
    <button class="mode m-bal" id="mBal" onclick="pickMode('balance')"><span class="ic">🔍</span><span class="tx"><b>잔액 확인</b><small>학생용 안내 태블릿</small></span><em class="tag" hidden></em></button>
    <button class="mode m-test" id="mTest" onclick="pickMode('test')" hidden><span class="ic">🧪</span><span class="tx"><b>부하테스트</b><small>복사본 전용</small></span></button>
  </div>
</section>

<!-- 3. 대상 선택 -->
<section id="vSetup" hidden>
  <div id="setupTitle" class="title"></div>
  <div id="setupList"></div>
</section>

<!-- 4. 작동 화면 -->
<section id="vRun" hidden>
  <div id="cfg"></div>
  <div id="cfgBtns" class="chips"></div>
  <div id="stage"><div id="reader"></div></div>
  <div id="result"></div>
  <div id="tools">
    <button class="tb" onclick="flipCam()">📷 카메라 전환</button>
    <button class="tb" onclick="toggleMirror()">↔ 좌우반전</button>
    <button class="tb" onclick="$('camFile').click()">📸 사진으로 스캔</button>
    <button class="tb" onclick="soundTest()">🔊 소리 테스트</button>
    <button id="btnUndo" hidden onclick="undo()">↩ 방금 결제 취소</button>
    <input id="camFile" type="file" accept="image/*" capture="environment" hidden onchange="photoScan(this)">
  </div>

  <div id="keypad" hidden><div class="kpbox">
    <div id="kpTitle">작품 번호를 입력하세요</div>
    <div id="kpSub"></div>
    <div id="kpDisp"></div>
    <div id="wgrid" class="wgrid" hidden></div>
    <div id="kpInfo"></div>
    <div class="keys" id="keys">
      <button onclick="kp('1')">1</button><button onclick="kp('2')">2</button><button onclick="kp('3')">3</button>
      <button onclick="kp('4')">4</button><button onclick="kp('5')">5</button><button onclick="kp('6')">6</button>
      <button onclick="kp('7')">7</button><button onclick="kp('8')">8</button><button onclick="kp('9')">9</button>
      <button onclick="kp('C')">지움</button><button onclick="kp('0')">0</button><button onclick="kp('B')">←</button>
    </div>
    <div class="row2">

<script>

var pin = '', boot = null, mode = '', target = {}, qr = null, facing = 'environment';

function $(id) { return document.getElementById(id); }

/* ---------- PIN ---------- */
function unlock() {

}

function showMenu() {
  show('vMenu'); $('modeLabel').innerText = '';
  var st = boot.status, off = (st.all !== '열림');
  function setBtn(id, flag) {
    var b = $(id), open = !off && flag === '열림', t = b.querySelector('.tag');

}

function goHome() { hideBal(); hidePop(); stopCam(); clearTimeout(kpTimer); $('keypad').hidden = true; busy = false; showMenu(); }

/* ---------- 모드 선택 ---------- */
function pickMode(m) {
  mode = m; target = {}; busy = false;
  if (m === 'test') { show('vTest'); $('modeLabel').innerText = '부하테스트'; return; }
  if (m === 'work') {
    var zs = zoneList();
    if (!zs.length) { $('modeLabel').innerText = '작품 좋아요'; startRun(); return; }
    var zl = $('setupList'); zl.innerHTML = '';
    $('setupTitle').innerText = '이 태블릿은 어느 구역입니까?';
    zs.forEach(function (z) {
      addChip(zl, z.name, z.count + '개 · ' + z.min + '~' + z.max + '번', function () { target = { zone: z.name }; $('modeLabel').innerText = '작품 좋아요 · ' + z.name; startRun(); });
    });
    show('vSetup'); return;
  }
  if (m === 'balance') { $('modeLabel').innerText = '잔액 확인'; startRun(); return; }
  if (m === 'super') { $('modeLabel').innerText = '슈퍼챗'; startRun(); return; }
  if (m === 'wage') { $('modeLabel').innerText = '근로 지급'; startRun(); return; }
  if (m === 'market') { $('modeLabel').innerText = '코인 마켓'; lastAmt = 0; startRun(); return; }
  var list = $('setupList'); list.innerHTML = '';
  if (m === 'hall') {
    $('setupTitle').innerText = '어느 발표입니까?';
    boot.sessions.filter(function (s) { return s.open; }).forEach(function (s) {
      addChip(list, s.name, '', function () { target = { session: s.code, label: s.name }; $('modeLabel').innerText = '발표장 · ' + s.name; startRun(); });
    });
    if (!list.children.length) list.innerHTML = '<div class="small">열려 있는 발표가 없습니다. (시트 [발표] 상태 확인)</div>';
  } else if (m === 'booth') {
    $('setupTitle').innerText = '어느 부스입니까?';
    var names = [];
    boot.booths.forEach(function (b) { if (names.indexOf(b.booth) < 0) names.push(b.booth); });
    names.forEach(function (n) { addChip(list, n, '', function () { target = { booth: n, program: '' }; $('modeLabel').innerText = '부스 · ' + n; startRun(); }); });
    if (!names.length) list.innerHTML = '<div class="small">등록된 부스가 없습니다. (시트 [부스] 확인)</div>';
  }
  show('vSetup');
}
// 작품 시트의 '구역'별 목록 (구역이 하나도 없으면 빈 배열 → 번호 입력 방식)
function zoneList() {
  var zs = {};
  Object.keys(boot.works).forEach(function (no) {
    var z = boot.works[no].zone; if (!z) return;
    var n = parseInt(no, 10);
    if (!zs[z]) zs[z] = { name: z, count: 0, min: n, max: n };
    zs[z].count++; if (n < zs[z].min) zs[z].min = n; if (n > zs[z].max) zs[z].max = n;
  });
  return Object.keys(zs).map(function (k) { return zs[k]; }).sort(function (a, b) { return a.min - b.min; });
}
function addChip(parent, text, sub, fn) {
  var b = document.createElement('button'); b.className = 'chip'; b.innerHTML = esc(text) + (sub ? '<small>' + esc(sub) + '</small>' : ''); b.onclick = fn; parent.appendChild(b); return b;
}

/* ---------- 작동 화면 ---------- */
function startRun() {

  $('keypad').hidden = true; hideUndo();
  startCam();
  if (mode === 'market') setTimeout(function () { if (!target.amount && $('keypad').hidden) openAmountKeypad('market'); }, 350);
}

function renderCfg() {
  var cfg = $('cfg'), box = $('cfgBtns'); box.innerHTML = '';
  if (mode === 'balance') cfg.innerText = '내 QR을 보여주세요 → 내 코인이 나와요 (조회만 돼요)';
  else if (mode === 'work') cfg.innerText = target.zone ? '학생 QR 스캔 → 작품 선택 → 좋아요 ♥' : '학생 QR 스캔 → 작품 번호 입력 → 좋아요 ♥';
  else if (mode === 'hall') cfg.innerText = '학생 QR만 찍으면 입장 · 외출 · 퇴장이 자동으로 처리돼요';
  else if (mode === 'booth') {
    cfg.innerText = '프로그램을 고른 뒤 학생 QR을 스캔하세요';
    boot.booths.filter(function (b) { return b.booth === target.booth; }).forEach(function (b) {
      var c = addChip(box, b.program, fmt(b.price) + 'C', function () { target.program = b.program; renderCfg(); });
      if (target.program === b.program) c.classList.add('sel');
    });
  } else if (mode === 'market') {
    cfg.innerText = target.amount ? '판매 금액 ' + fmt(target.amount) + 'C · 학생 QR을 스캔하세요' : '판매 금액을 입력한 뒤 학생 QR을 스캔하세요';
    var c1 = addChip(box, target.amount ? fmt(target.amount) + 'C' : '✏️ 금액 입력', target.amount ? '눌러서 금액 변경' : '', function () { openAmountKeypad('market'); });
    if (target.amount) c1.classList.add('sel');
    if (!target.amount && lastAmt) addChip(box, fmt(lastAmt) + 'C', '직전 금액 다시 쓰기', function () { target.amount = lastAmt; renderCfg(); });
  } else if (mode === 'wage') {
    cfg.innerText = '업무를 고른 뒤, 일을 마친 학생의 QR을 스캔하세요';
    boot.tasks.forEach(function (t) {
      var c = addChip(box, t.name, '+' + fmt(t.pay) + 'C', function () { target.task = t.name; renderCfg(); });
      if (target.task === t.name) c.classList.add('sel');
    });
    if (!boot.tasks.length) box.innerHTML = '<div class="small">등록된 업무가 없습니다. (시트 [근로] 확인)</div>';
  } else if (mode === 'super') {
    cfg.innerText = '팀과 금액을 고른 뒤 학생 QR을 스캔하세요';
    boot.teams.filter(function (t) { return t.open; }).forEach(function (t) {
      var c = addChip(box, t.no + '번', t.name, function () { target.team = t.no; target.teamName = t.name; renderCfg(); });
      if (target.team === t.no) c.classList.add('sel');
    });
    var br = document.createElement('div'); br.style.width = '100%'; box.appendChild(br);
    boot.superOptions.forEach(function (a) {
      var c = addChip(box, fmt(a) + 'C', '', function () { target.amount = a; renderCfg(); });
      if (target.amount === a) c.classList.add('sel');
    });
    var custom = target.amount && boot.superOptions.indexOf(target.amount) < 0;
    var cc = addChip(box, custom ? fmt(target.amount) + 'C' : '✏️ 직접 입력', custom ? '직접 입력 · 눌러서 변경' : '', function () { openAmountKeypad('super'); });
    if (custom) cc.classList.add('sel');
  }
  fitReader();
}

/* 카메라 크기: 남은 화면 높이에 맞춰 자동으로 줄여서 아래가 잘리지 않게 합니다 */
function fitReader() {
  var r = $('reader'); if (!r || $('vRun').hidden) return;
  var v = r.querySelector('video'), ar = (v && v.videoWidth) ? v.videoHeight / v.videoWidth : 0.75;
  var top = $('stage').getBoundingClientRect().top + window.scrollY;
  var pad = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--camPad')) || 0;
  var reserve = 74 + pad + ($('result').offsetHeight || 0);          // 아래 도구 줄 + 여백
  var availH = window.innerHeight - top - reserve, availW = document.documentElement.clientWidth - 28;
  var w = Math.max(220, Math.min(availW, availH / ar, 900));
  r.style.width = Math.floor(w) + 'px';
}
window.addEventListener('resize', fitReader); window.addEventListener('orientationchange', function () { setTimeout(fitReader, 300); });
/* ---------- 카메라 ---------- */
function startCam() {
  if (qr) return;
  try {
    qr = new Html5Qrcode('reader');
    qr.start({ facingMode: facing }, { fps: 10, aspectRatio: 1.333, qrbox: function (w, h) { var m = Math.min(w, h), q = Math.floor(m * 0.72); return { width: q, height: q }; } }, onScan, function () {})
      .then(function () { applyMirror(); setResult('', ''); var v = $('reader').querySelector('video'); if (v) { v.addEventListener('loadedmetadata', fitReader); } setTimeout(fitReader, 200); setTimeout(fitReader, 800); })
      .catch(function (e) { qr = null; camFail(e); });
  } catch (e) { qr = null; camFail(e); }
}
function camFail(e) {
  var n = (e && (e.name || e.message)) ? String(e.name || '') + ' ' + String(e.message || e) : String(e || '알 수 없음');
  var hint = /NotAllowed|Permission|denied/i.test(n) ? '권한/보안 정책으로 차단됨'
    : /NotFound|Devices/i.test(n) ? '카메라 장치를 찾지 못함'
    : /NotReadable|TrackStart/i.test(n) ? '다른 앱이 카메라를 쓰는 중'
    : /Security/i.test(n) ? '보안 정책(https/iframe)으로 차단됨'
    : (typeof Html5Qrcode === 'undefined') ? '스캔 라이브러리를 불러오지 못함(인터넷 확인)' : '원인 불명';
  setResult('err', '카메라를 켤 수 없습니다.\n[' + hint + ']\n' + n.slice(0, 120) + '\n\n아래 [📸 사진 찍어서 스캔] 버튼으로 계속 사용할 수 있습니다.');
}

// 카메라 영상 스캔이 막힌 기기용: 기본 카메라 앱으로 QR을 사진 찍어 읽습니다.
function photoScan(inp) {
  var f = inp.files && inp.files[0]; inp.value = '';
  if (!f) return;
  if (typeof Html5Qrcode === 'undefined') { setResult('err', '스캔 라이브러리를 불러오지 못했습니다.\n인터넷 연결을 확인하세요.'); return; }
  setResult('', '사진에서 QR 읽는 중...');
  var tmp = qr || new Html5Qrcode('reader');
  tmp.scanFile(f, false).then(function (text) { lastText = ''; onScan(text); })
    .catch(function () { feedback(false); setResult('err', 'QR을 읽지 못했습니다.\nQR을 화면에 크게 담아 다시 찍어주세요.'); });
}
function stopCam() { if (qr) { var q = qr; qr = null; q.stop().then(function () { q.clear(); }).catch(function () {}); } }
// 좌우반전(거울모드): 화면 표시만 뒤집습니다. QR 인식에는 영향 없음. 전면 카메라는 기본 반전, 선택은 기기에 저장됩니다.
function mirrorOn() {
  var v = null; try { v = localStorage.getItem('mirror'); } catch (e) {}
  return v === null ? facing === 'user' : v === '1';
}
function applyMirror() { var r = document.getElementById('reader'); if (r) r.classList.toggle('mirror', mirrorOn()); }
function toggleMirror() { try { localStorage.setItem('mirror', mirrorOn() ? '0' : '1'); } catch (e) {} applyMirror(); }
function flipCam() { facing = (facing === 'environment') ? 'user' : 'environment'; try { localStorage.removeItem('mirror'); } catch (e) {} applyMirror(); stopCam(); setTimeout(startCam, 400); }

/* ---------- 스캔 ---------- */
function onScan(text) {
  var now = Date.now();
  if (busy || !$('keypad').hidden || !$('gate').hidden) return;   // 키패드가 열려 있는 동안에는 스캔하지 않음
  if (text === lastText && now - lastAt < (mode === 'balance' ? 8000 : 2500)) return;
  lastText = text; lastAt = now;
  text = String(text).trim().toUpperCase();
  if (!/^[A-Z0-9]{6,12}$/.test(text)) { feedback(false); popup({ lv: 'err', ic: '⛔', title: '학생 QR이 아니에요', note: '학생 카드의 QR을 보여주세요', ms: 2000 }); return; }

  if (mode === 'booth' && !target.program) { feedback(false); popup({ lv: 'warn', ic: '👆', title: '프로그램을 먼저 선택하세요', ms: 1800 }); return; }
  if (mode === 'wage' && !target.task) { feedback(false); popup({ lv: 'warn', ic: '👆', title: '업무를 먼저 선택하세요', ms: 1800 }); return; }
  if (mode === 'super' && (!target.team || !target.amount)) { feedback(false); popup({ lv: 'warn', ic: '👆', title: '팀과 금액을 먼저 선택하세요', ms: 1800 }); return; }

  scanBeep(); // QR이 인식된 즉시 큰 소리
  if (mode === 'balance') { showBal(text); return; }
  if (mode === 'work') { pendingId = text; busy = true; openKeypad(); return; }
  if (mode === 'market' && !target.amount) { pendingId = text; busy = true; openAmountKeypad('market', true); return; }
  submit(text);
}

function devLabel() {
  return mode + (target.booth ? ':' + target.booth : '') + (target.session ? ':' + target.session : '') + (target.task ? ':' + target.task : '') + (target.zone ? ':' + target.zone : '');
}
// 학생용 잔액 확인: 조회만 합니다. 6초 뒤 자동으로 지워져 다음 학생에게 앞 학생의 잔액이 보이지 않습니다.
var balTimer = null;
function showBal(id) {
  var b = $('bal'); clearTimeout(balTimer);
  b.innerHTML = '<div><div class="bn">⏳ 확인 중...</div></div>'; b.hidden = false;
  var mine = ++seq;
  google.script.run
    .withSuccessHandler(function (r) {
      if (mine !== seq) return;
      if (!r.ok) { feedback(false); b.innerHTML = '<div><div class="bn" style="font-size:44px">' + esc(r.msg) + '</div><div class="bh">화면을 터치하면 닫힙니다</div></div>'; balTimer = setTimeout(hideBal, 3000); return; }
      feedback(true);
      var rows = r.recent.map(function (x) { return '<div><span>' + esc(x.label) + '</span><span class="' + (x.delta < 0 ? 'm' : 'p') + '">' + (x.delta > 0 ? '+' : '') + fmt(x.delta) + 'C</span></div>'; }).join('');
      b.innerHTML = '<div><div class="bn">' + esc(r.name) + '님의 잔액</div><div class="bv">' + fmt(r.balance) + '<i>C</i></div>'
        + '<div class="bs">처음 ' + fmt(r.initial) + 'C · 쓴 코인 ' + fmt(r.spent) + 'C' + (r.got ? ' · 받은 코인 ' + fmt(r.got) + 'C' : '') + '</div>'
        + (rows ? '<div class="bl">' + rows + '</div>' : '<div class="bs">아직 사용 내역이 없어요</div>')
        + '<div class="bh">6초 뒤 자동으로 사라집니다 · 터치하면 닫힘</div></div>';
      balTimer = setTimeout(hideBal, 6000);
    })
    .withFailureHandler(function () { if (mine !== seq) return; feedback(false); b.innerHTML = '<div><div class="bn" style="font-size:40px">통신 오류<br>잠시 후 다시 찍어 주세요</div></div>'; balTimer = setTimeout(hideBal, 3000); })
    .balance(pin, id);
}
function hideBal() { clearTimeout(balTimer); $('bal').hidden = true; }
// [처음] 버튼은 없습니다(학생이 누르는 것 방지). 선생님은 상단 제목줄을 5번 연속 터치 → PIN 입력 → 처음 화면으로.
var hdrTaps = 0, hdrT = null, gateT = null;
document.querySelector('header').addEventListener('click', function () {
  if (!pin || !$('vPin').hidden) return;
  hdrTaps++; clearTimeout(hdrT); hdrT = setTimeout(function () { hdrTaps = 0; }, 2500);
  if (hdrTaps >= 5) { hdrTaps = 0; openGate(); }
});
function openGate() { $('gate').hidden = false; $('gpin').value = ''; $('gmsg').innerText = ''; setTimeout(function () { $('gpin').focus(); }, 50); clearTimeout(gateT); gateT = setTimeout(closeGate, 25000); }
function closeGate() { clearTimeout(gateT); $('gate').hidden = true; $('gpin').value = ''; }
function gateOk() {
  if ($('gpin').value.trim() === pin) { closeGate(); goHome(); }
  else { $('gmsg').innerText = 'PIN이 달라요'; $('gpin').value = ''; }
}

/* ---------- 오프라인 임시저장 대기열 (발표장 전용) ---------- */
var Q_KEY = 'coinQ', Q = [], flushing = false;
try { Q = JSON.parse(localStorage.getItem(Q_KEY) || '[]') || []; } catch (e) { Q = []; }

}
function flushQ() {

  flushing = true;

  batch.forEach(function (it) { if ((it.tries || 0) >= 20) it.final = true; });
  var guard = setTimeout(function () { flushing = false; }, 60000);
  google.script.run
    .withSuccessHandler(function (r) {

      var by = {}, okN = 0, badN = 0, removed = 0;
      (r.results || []).forEach(function (x) { by[x.qid] = x; });
      batch.forEach(function (it) {

        if (x.retry) { it.tries = (it.tries || 0) + 1; return; }
        qRemove(it.qid); removed++;
        if (x.ok || /이미/.test(x.msg || '')) okN++; else badN++;
      });
      qSave();
      if (okN || badN) toast(badN ? 'warn' : 'ok', '임시저장 ' + (okN + badN) + '건 전송 완료' + (badN ? '\n확인 필요 ' + badN + '건 → [동기화실패] 시트' : ''));
      if (removed && Q.length) setTimeout(flushQ, 500);
    })
    .withFailureHandler(function () { clearTimeout(guard); flushing = false; qBadge(); })
    .syncBatch(pin, batch);
}

/* ---------- 화면/소리 ---------- */

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function nameOf(id) { return (boot && boot.students && id && boot.students[String(id).toUpperCase()]) || ''; }
// 소리: 모든 QR 인식/결과에 반드시 소리가 나도록, 일시정지된 오디오를 매번 깨운 뒤 재생합니다.
function playTones(tones) {
  try { if (navigator.vibrate) navigator.vibrate(tones.vib); } catch (e) {}
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var go = function () {
      var t = actx.currentTime;
      tones.list.forEach(function (n) {
        var o = actx.createOscillator(), g = actx.createGain(); o.type = n.type || 'square'; o.frequency.value = n.f; g.gain.value = 0.5;
        o.connect(g); g.connect(actx.destination); o.start(t + n.at); o.stop(t + n.at + n.dur);
      });
    };

  } catch (e) {}
}
// QR이 인식된 즉시: 삑삑
function scanBeep() { playTones({ vib: 60, list: [{ f: 1500, at: 0, dur: 0.1 }, { f: 1500, at: 0.16, dur: 0.1 }] }); }
// 결과: 성공=띠링(올라가는 소리), 실패/경고=낮고 긴 부저
function feedback(ok) {
  playTones(ok ? { vib: 80, list: [{ f: 1000, at: 0, dur: 0.1, type: 'sine' }, { f: 1500, at: 0.11, dur: 0.16, type: 'sine' }] }
               : { vib: [120, 60, 120], list: [{ f: 260, at: 0, dur: 0.4 }] });
}

/* ---------- 부하테스트 (사본 전용) ---------- */
function runTest() {
  var N = parseInt($('tN').value, 10) || 100, C = parseInt($('tC').value, 10) || 5, log = $('testLog');
  var prog = boot.booths[0];
  if (!prog) { log.innerText = '[부스]에 프로그램이 1개 이상 있어야 합니다. 그리고 [설정]의 부스를 "열림"으로 바꾸세요.'; return; }
  log.innerText = '테스트 학생 ID 불러오는 중...';
  google.script.run.withSuccessHandler(function (r) {
    if (!r.ok) { log.innerText = r.msg; return; }
    var ids = r.ids; if (!ids.length) { log.innerText = '학생지갑에 ID가 없습니다.'; return; }
    var sent = 0, finished = 0, okc = 0, bad = 0, lat = [], t0 = Date.now(), msgs = {};
    function next() {
      if (sent >= N) return;
      var i = sent++, t1 = Date.now();
      google.script.run.withSuccessHandler(function (res) {
        lat.push(Date.now() - t1); if (res.ok) okc++; else { bad++; msgs[res.msg.split('\n')[0]] = (msgs[res.msg.split('\n')[0]] || 0) + 1; }
        fin();
      }).withFailureHandler(function () { lat.push(Date.now() - t1); bad++; msgs['통신실패'] = (msgs['통신실패'] || 0) + 1; fin(); })
        .processScan({ pin: pin, mode: 'booth', studentId: ids[i % ids.length], target: { booth: prog.booth, program: prog.program }, device: 'LOADTEST' });
    }
    function fin() {
      finished++; log.innerText = '진행 ' + finished + ' / ' + N + ' ...';
      if (finished < N) { next(); return; }
      var sec = (Date.now() - t0) / 1000; lat.sort(function (a, b) { return a - b; });
      var avg = lat.reduce(function (a, b) { return a + b; }, 0) / lat.length;
      var m = Object.keys(msgs).map(function (k) { return '  - ' + k + ': ' + msgs[k] + '건'; }).join('\n');
      log.innerText = '✅ 테스트 완료\n요청 ' + N + '건 / 동시 ' + C + '건\n성공 ' + okc + ' · 실패/거절 ' + bad + '\n평균 응답 ' + (avg / 1000).toFixed(2) + '초\n상위5%(느린 쪽) ' + (lat[Math.floor(lat.length * 0.95)] / 1000).toFixed(2) + '초\n최대 ' + (lat[lat.length - 1] / 1000).toFixed(2) + '초\n초당 처리량 ' + (N / sec).toFixed(2) + '건/초\n총 ' + sec.toFixed(1) + '초' + (m ? '\n거절 사유:\n' + m : '');
    }
    for (var c = 0; c < Math.min(C, N); c++) next();
  }).withFailureHandler(function (e) { log.innerText = '오류: ' + e.message; }).getTestIds(pin, N);
}
