<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문화코인 사용 설명서</title>
<style>
  :root { --ink: #1a1d2e; --mut: #555a75; --line: #cfd3ea; --pri: #4b3df2; --soft: #eef0ff; --gold: #fff6dc; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9ebf5; color: var(--ink); font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif; font-size: 14px; line-height: 1.55; }
  .bar { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); padding: 10px 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bar b { flex: 1 1 220px; } .bar button { border: 0; border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 800; background: var(--pri); color: #fff; cursor: pointer; }
  .page { width: 210mm; max-width: 100%; margin: 12px auto; background: #fff; padding: 12mm 15mm; box-shadow: 0 2px 14px rgba(20,20,60,.12); }
  .hero { background: linear-gradient(135deg, #4b3df2, #7a3cff); color: #fff; border-radius: 14px; text-align: center; padding: 14px 10px; margin-bottom: 6px; }
  .hero h1 { margin: 0; font-size: 28px; letter-spacing: -.01em; } .hero div { font-size: 12.5px; opacity: .9; margin-top: 3px; }
  h2 { font-size: 15.5px; margin: 14px 0 6px; } h2::before { content: '▌'; color: var(--pri); margin-right: 5px; }
  ul { margin: 3px 0 3px 0; padding-left: 18px; } li { margin: 2px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 4px 0 6px; } th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; } th { background: var(--soft); font-size: 12.5px; } td:first-child { font-weight: 800; background: #f7f7fd; white-space: nowrap; }
  .box { border: 1.5px solid var(--pri); background: var(--soft); border-radius: 10px; padding: 8px 12px; margin: 8px 0; } .box.gold { border-color: #f2a900; background: var(--gold); }
  .box b.t { display: block; margin-bottom: 2px; }
  .steps li { margin: 4px 0; } .muted { color: var(--mut); font-size: 12px; } .pb { break-before: page; }
  @page { size: A4; margin: 9mm; }
  @media print { body { background: #fff; font-size: 12.5px; line-height: 1.45; } .hero h1 { font-size: 24px; } h2 { margin: 9px 0 4px; } table { font-size: 12px; margin: 3px 0 4px; } th, td { padding: 4px 7px; } .box { margin: 6px 0; padding: 6px 10px; } .bar { display: none; } .page { box-shadow: none; margin: 0; width: auto; padding: 0; } * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } .pb { break-before: page; } }
</style>
</head>
<body>
<div class="bar"><b>🪙 문화코인 사용 설명서 <span class="muted" id="st">· 숫자를 불러오는 중…</span></b><button onclick="print()">🖨 인쇄 / PDF로 저장</button></div>
<div class="page" id="p1"></div>
<div class="page pb" id="p2"></div>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbxBcTW2Pmh0zMAMqXArfnAmiRgTCuyfuoRXJegWzeFzf-a8GzWyjX2aoPSG1CaYIvxV/exec';
function C(n) { return Number(n).toLocaleString('ko-KR') + 'C'; }
function render(g, live) {
  var Q = function (v, f) { return (live && v > 0) ? f(v) : null; };
  var reward = !live || !g.rewardMax ? '발표마다 달라요 (안내판)' : (g.rewardMin === g.rewardMax ? C(g.rewardMax) : C(g.rewardMin) + ' ~ ' + C(g.rewardMax)) + ' (발표마다)';
  var like = live ? '1번에 ' + C(g.like) + (g.likeDay ? ' · 하루 ' + C(g.likeDay) + '까지' : '') + (g.likeTot ? ' · 행사 전체 ' + C(g.likeTot) + '까지' : '') : '안내판 확인';
  var sup = live ? (g.supMax ? '1번에 ' + C(g.supMin) + ' ~ ' + C(g.supMax) : '1번에 ' + C(g.supMin) + ' 이상') + (g.supTot ? ' · 행사 전체 ' + C(g.supTot) + '까지' : '') : '안내판 확인';
  var big = live && g.supMax ? '금액이 클수록 전광판에 더 화려하게 나와요. ' + C(g.supMax) + '는 가장 크게 터져요!' : '금액이 클수록 전광판에 더 화려하게 나와요.';
  var recvRow = (live && g.recv > 0) ? '<tr><td>내 작품·발표가 받은 좋아요</td><td>전시 작품이나 발표를 한 학생은, 다른 학생이 좋아요를 누를 때마다 코인을 받아요.</td><td>1번에 ' + C(g.recv) + (g.recvTot ? ' · 최대 ' + C(g.recvTot) + '까지' : '') + '</td></tr>' : '';
  var wageRow = (live && g.wage > 0) ? '<tr><td>시간제 근로</td><td>일하는 곳에서 <b>시작 QR</b> → 일을 마치면 <b>종료 QR</b>. 최소 ' + g.wageMin + '분은 채워야 인정, 1번에 최대 ' + g.wageMax + '분까지.</td><td>1분에 ' + C(g.wage) + (g.wageTot ? ' (총 ' + C(g.wageTot) + '까지)' : '') + '</td></tr>' : '';
  var init = live && g.initMax ? '행사 전에 학교 기록(상점)에 따라 미리 들어 있어요. 사람마다 달라요 (최대 ' + C(g.initMax) + ').' : '행사 전에 학교 기록(상점)에 따라 미리 들어 있어요.';
  var msgs = live ? g.msgLen + '글자까지, 한 번 보내고 ' + g.msgGap + '초 뒤에 또 보낼 수 있어요' : '짧게, 너무 자주는 안 돼요';
  $('p1').innerHTML =
    '<div class="hero"><h1>🪙 문화코인 사용 설명서</h1><div>문화고 문화 아고라 · 학술제 · 학급 부스 · 장기자랑 · 학생안전부</div></div>' +
    '<h2>문화코인이 뭐예요?</h2><p>문화 아고라 동안 학교 안에서만 쓰는 가상 화폐예요. 발표를 듣고, 작품을 구경하고, 부스에서 놀고, 장기자랑을 응원하면서 벌고 쓰는 거예요. 종이돈이 아니라 <b>내 학생 QR 카드를 “찍으면”</b> 기록돼요. 현금으로 바꿀 수 없고, 행사가 끝나면 쓸 수 없어요.</p>' +
    '<h2>내 학생 QR 카드 = 내 지갑</h2><ul><li><b>한 사람에 한 장.</b> 친구 카드를 대신 찍거나 빌려 쓰면 안 돼요.</li><li><b>카드 사진을 찍어 올리거나 친구에게 보내지 마세요.</b> QR만 있으면 누구나 내 코인을 쓸 수 있어요.</li>' +
    '<li><b>잃어버렸다면 바로 담임선생님께!</b> 새 카드를 받고 코인은 그대로 이어져요. 옛 카드는 알린 그 순간부터 <b>누가 찍어도 쓸 수 없고</b>, 찍으려 한 기록이 남아요. 단, 알리기 전에 쓰인 코인은 돌려받기 어려울 수 있어요.</li>' +
    '<li><b>잔액이 궁금하면</b> “잔액 확인” 태블릿에 카드를 대 보세요. (몇 초 뒤 화면이 자동으로 지워져요)</li></ul>' +
    '<h2>코인을 버는 방법</h2><table><tr><th>방법</th><th>어떻게 하나요?</th><th>받는 코인</th></tr>' +
    (live && g.tPer > 0 ? '<tr><td>학술제 발표 듣기</td><td>발표장은 <b>하루 종일 자유롭게</b> 들어갈 수 있어요. 들어갈 때 <b>QR</b>, 나올 때 <b>한 번 더 QR</b>을 찍으면 <b>들은 시간만큼</b> 코인이 들어와요. 화장실에 다녀올 땐 나올 때 찍고 다시 들어갈 때 또 찍어요. <b>나갈 때 QR을 안 찍으면 그 시간은 코인이 없어요!</b> 한 번에 ' + g.tMin + '분 이상 들어야 인정, 1번에 최대 ' + g.tMax + '분까지.</td><td>1분에 ' + C(g.tPer) + (g.tCap ? ' (하루 ' + C(g.tCap) + '까지)' : '') + '</td></tr>' : '') +
    (live && g.tPer > 0 && g.pBonus > 0 ? '<tr><td>내가 발표하는 날</td><td>발표하는 학생은 <b>입장 QR</b>을 찍을 때 발표 팀마다 한 번 보너스를 받아요.</td><td>' + C(g.pBonus) + ' (팀마다 1번)</td></tr>' : '') +
    (live && g.tPer > 0 ? '' : '<tr><td>학술제 발표 듣기</td><td>입장 <b>QR</b> → 끝까지 듣기 → 나갈 때 퇴장 <b>QR</b>. 발표 시작 전에 미리 들어가 있어도 “발표 시작 시각”부터 시간으로 인정해요. 늦게 들어와도 ' + (live ? g.late : 5) + '분 안이면 OK, 중간에 화장실은 ' + (live ? g.wc : 15) + '분 안에 다녀오세요.</td><td>' + reward + '</td></tr>') +
    '<tr><td>작품 좋아요</td><td>작품 구역 태블릿에 <b>내 카드를 찍고</b> 마음에 드는 <b>작품 번호</b>를 눌러요. 같은 작품에는 1번만!</td><td>' + like + '</td></tr>' +
    (recvRow) +
    '<tr><td>발표 좋아요</td><td>' + (live && g.tPer > 0 ? '발표장 태블릿에서 <b>마음에 드는 발표 팀을 먼저 누른 뒤 10초 안에 내 카드를 찍으면</b> 그 팀에 좋아요! 하루에 ' + (g.pTeams || '여러') + '팀까지, 같은 팀에는 1번만 가능해요.' : '발표를 들은 사람은 태블릿에 뜨는 <b>♥ 이 발표 좋아요</b> 버튼을 누를 수 있어요.') + ' 위 좋아요 한도에 함께 들어가요.</td><td>같은 코인</td></tr>' + wageRow +
    '<tr><td>처음 받는 코인</td><td>' + init + '</td><td>사람마다 달라요</td></tr></table>' +
    '<h2>코인을 쓰는 방법</h2><table><tr><th>어디서?</th><th>어떻게?</th><th>언제?</th></tr>' +
    '<tr><td>학급 부스</td><td>부스 태블릿에 카드를 찍어 결제해요. 잔액이 부족하면 결제가 안 돼요. 가격은 부스에 적혀 있어요. <b>게임에서 이기면 코인을 받는 부스</b>도 있어요. 이긴 학생이 카드를 찍으면 코인이 들어와요.</td><td>12/23(수) 오전</td></tr>' +
    '<tr><td>코인 마켓</td><td>가게에서 금액을 알려 주면 카드를 찍어요.</td><td>12/23(수) 오전 <b>부스 시간에만!</b> (장기자랑 전에 닫혀요)</td></tr>' +
    '<tr><td>후원 투표 (장기자랑)</td><td>마음에 드는 팀에 코인을 후원해요. ' + sup + '. 가장 많이 모은 팀이 우승! ' + big + '</td><td>12/23(수) 오후 강당</td></tr></table>' +
    '<div class="box gold"><b class="t">💡 꿀팁 — 장기자랑에도 코인이 필요해요!</b>후원 투표와 응원으로 좋아하는 팀을 도울 수 있어요. 코인 마켓은 장기자랑 전에 닫히니까, <b>부스에서 다 쓰지 말고 조금 남겨 두세요.</b></div>';

  $('p2').innerHTML =
    '<h2>📱 폰으로 후원하고 응원하기 (장기자랑)</h2><ol class="steps"><li>강당 전광판에 나오는 <b>QR</b>을 휴대폰 카메라로 찍어요.</li>' +
    '<li>처음 한 번만 <b>내 학생 QR 카드를 등록</b>해요. 카메라로 카드의 QR을 보여 주거나, 카메라가 안 되면 카드 QR 아래의 <b>8자리 글자</b>를 입력해요.</li>' +
    '<li><b>후원:</b> 응원하는 팀과 금액을 골라요. (코인이 차감돼요)</li>' +
    '<li><b>응원 메시지:</b> 코인 없이 보낼 수 있어요. ' + msgs + '. 하트와 함께 전광판에 날아가요 💖</li></ol>' +
    '<div class="box" style="border-color:#f2a900;background:#fff6dc"><b class="t">⚠ 응원 메시지 약속</b><ul><li>보낸 사람의 <b>학번·이름이 모두 기록</b>돼요. (전광판에는 이름 일부만 보여요)</li><li>욕설·비방·놀림·특정인을 겨냥한 글은 자동으로 막히고, 기록을 보고 <b>학교 규정에 따라 지도·조치</b>해요.</li><li>다른 친구 카드로 보내는 것도 안 돼요. 모두가 기분 좋은 응원만 남겨요!</li></ul></div>' +
    '<h2>문화 아고라 일정</h2><table><tr><th>날짜</th><th>내용</th></tr><tr><td>12/18 (금)</td><td>🧪 시험 운영 — 이 설명서를 받는 날! 연습 코인으로 체험해 봐요. 연습 기록은 지우고 처음 상태로 되돌려요.</td></tr><tr><td>12/21 (월) ~ 12/22 (화)</td><td>학술제: 발표 듣기 · 작품 좋아요' + ((live && g.wage > 0) ? ' · 시간제 근로' : '') + '로 코인 모으기</td></tr><tr><td>12/23 (수)</td><td>오전 학급 부스(코인 쓰기) · 오후 강당 장기자랑 후원 투표 + 응원 메시지</td></tr><tr><td>12/24 (목)</td><td>방학식 · 1교시 정리</td></tr></table>' +
    '<h2>🏅 이런 상도 있어요</h2><table><tr><td>작품 좋아요상 🎨</td><td>좋아요를 가장 많이 받은 작품</td></tr><tr><td>발표 좋아요상 🎤</td><td>좋아요를 가장 많이 받은 탐구 발표</td></tr><tr><td>스크루지상 🧓</td><td>코인을 벌고도 가장 아껴 모은 사람</td></tr><tr><td>플렉스상 💸</td><td>코인을 가장 화끈하게 쓴 사람</td></tr><tr><td>후원왕 🎁</td><td>장기자랑에 가장 많이 후원한 사람</td></tr><tr><td>응원왕 💌</td><td>응원 메시지를 가장 많이 보낸 사람</td></tr><tr><td>순위 시상 🏆</td><td>후원을 가장 많이 받은 1·2·3위 팀 — 단상에서 시상!</td></tr></table>' +
    '<h2>자주 묻는 질문</h2><ul><li><b>QR이 안 찍혀요.</b> 카드를 카메라 가까이, 밝은 곳에서 천천히 대 보세요. 그래도 안 되면 선생님께 말씀하세요.</li><li><b>실수로 결제했어요.</b> 바로 그 자리에서 선생님께 알려 주세요. 시간이 지나면 확인이 어려워요.</li><li><b>인터넷이 끊겼대요.</b> 일부 태블릿은 잠시 기록해 두었다가 연결되면 자동으로 보내요. 다시 찍지 않아도 돼요.</li><li><b>코인이 모자라요.</b> 발표 듣기·작품 좋아요' + ((live && g.wage > 0) ? '·시간제 근로' : '') + '로 더 벌 수 있어요!</li></ul>' +
    '<p class="muted" style="margin-top:10px">※ 코인 금액과 시간은 학교 사정에 따라 바뀔 수 있어요. 최신 내용은 담임선생님과 안내판을 확인하세요. · 담임선생님 연락/질문: ____________________ · 문화고등학교 학생안전부</p>';
}
function $(i) { return document.getElementById(i); }
render({}, false);
fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'guideInfo', args: [] }) })
  .then(function (r) { return r.json(); }).then(function (j) { var g = j && j.result; if (g && g.ok) { render(g, true); $('st').textContent = '· 현재 시스템 설정의 숫자로 채워졌어요'; } else throw 0; })
  .catch(function () { $('st').textContent = '· 숫자를 불러오지 못해 일반 문구로 표시했어요 (인터넷/배포 확인)'; });
</script>
</body>
</html>
