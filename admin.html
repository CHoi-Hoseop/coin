<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문화코인 관리자</title>
<style>
  :root { --bg: #f3f4f8; --card: #fff; --ink: #161a2b; --mut: #6b7090; --line: #e3e5ef; --pri: #4b3df2; --pri2: #7a3cff; --ok: #12905a; --okbg: #e3f6ec; --bad: #d12a4d; --badbg: #fde8ed; --warn: #b36b00; --warnbg: #fff3da; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1020; --card: #181b33; --ink: #eef0ff; --mut: #9aa0c8; --line: #2a2e52; --okbg: #11382a; --badbg: #3b1523; --warnbg: #3a2d10; --ok: #5be0a4; --bad: #ff8aa5; --warn: #ffc766; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; } body { background: var(--bg); color: var(--ink); font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif; padding: env(safe-area-inset-top) 0 40px; }
  header { position: sticky; top: 0; z-index: 10; background: linear-gradient(90deg, var(--pri), var(--pri2)); color: #fff; padding: 14px 16px 0; }
  header h1 { margin: 0; font-size: 18px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
  header h1 button { background: rgba(255,255,255,.2); border: 0; color: #fff; padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 700; }
  nav { display: flex; gap: 0; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  nav button { flex: 1 0 auto; padding: 11px 14px; border: 0; background: transparent; color: rgba(255,255,255,.75); font-size: 14px; font-weight: 700; border-bottom: 3px solid transparent; white-space: nowrap; }
  nav button.on { color: #fff; border-bottom-color: #fff; }
  main { max-width: 760px; margin: 0 auto; padding: 14px 14px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 16px; } .desc { color: var(--mut); font-size: 12.5px; line-height: 1.5; margin-top: 3px; }
  .sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); } .sw:last-child { border-bottom: 0; }
  .sw .nm { font-weight: 800; font-size: 15px; } .sw .tx { flex: 1; min-width: 0; }
  .tg { flex: 0 0 auto; display: flex; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
  .tg button { border: 0; padding: 9px 16px; font-size: 14px; font-weight: 800; background: transparent; color: var(--mut); min-width: 64px; }
  .tg button.on.pos { background: var(--ok); color: #fff; } .tg button.on.neg { background: var(--bad); color: #fff; }
  input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; font-size: 15px; }
  input:focus { outline: 2px solid var(--pri); border-color: transparent; }
  label { display: block; font-size: 12.5px; font-weight: 700; color: var(--mut); margin: 10px 0 4px; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } @media (max-width: 460px) { .g2 { grid-template-columns: 1fr; } }
  .btn { border: 0; border-radius: 11px; padding: 11px 16px; font-size: 15px; font-weight: 800; background: var(--pri); color: #fff; }
  .btn.sec { background: var(--bg); color: var(--ink); border: 1px solid var(--line); } .btn.red { background: var(--bad); } .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .chip { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 800; background: var(--bg); color: var(--mut); border: 1px solid var(--line); }
  .chip.in { background: var(--okbg); color: var(--ok); border-color: transparent; } .chip.out { background: var(--warnbg); color: var(--warn); border-color: transparent; } .chip.bad { background: var(--badbg); color: var(--bad); border-color: transparent; }
  .st { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 99px; } .st.정상 { background: var(--okbg); color: var(--ok); } .st.숨김 { background: var(--warnbg); color: var(--warn); } .st.차단 { background: var(--badbg); color: var(--bad); }
  .msg1 { padding: 12px 0; border-bottom: 1px solid var(--line); } .msg1:last-child { border-bottom: 0; } .msg1 .t { font-size: 16px; font-weight: 700; margin: 4px 0; word-break: break-all; } .msg1 .m { color: var(--mut); font-size: 12.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  details.grp { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
  details.grp > summary { list-style: none; cursor: pointer; padding: 14px 16px; font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
  details.grp > summary::-webkit-details-marker { display: none; } details.grp > summary::after { content: '▾'; color: var(--mut); transition: transform .2s; } details.grp[open] > summary::after { transform: rotate(180deg); }
  details.grp .body { padding: 0 16px 8px; }
  .set { padding: 12px 0; border-top: 1px solid var(--line); } .set .nm { font-weight: 800; font-size: 15px; } .set .in { display: flex; gap: 8px; align-items: center; margin-top: 8px; } .set .in input, .set .in select { flex: 1; } .set .unit { color: var(--mut); font-weight: 700; flex: 0 0 auto; }
  .seg { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; } .seg button { flex: 1 0 auto; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 14px; font-weight: 800; } .seg button.on { background: var(--pri); color: #fff; border-color: transparent; }
  .rc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; } .rc.dirty { border-color: var(--pri); box-shadow: 0 0 0 2px rgba(75,61,242,.15); } .rc.off { opacity: .6; }
  .rc .fl { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; } .rc .fl label { margin: 0 0 3px; }
  .rc .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; font-weight: 800; font-size: 14px; color: var(--mut); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #161a2b; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 700; z-index: 50; display: none; max-width: 90vw; text-align: center; white-space: pre-wrap; }
  #login { max-width: 360px; margin: 14vh auto 0; text-align: center; padding: 0 20px; } #login h2 { font-size: 22px; margin-bottom: 6px; } #login input { text-align: center; font-size: 22px; letter-spacing: 4px; margin: 14px 0; } #login .err { color: var(--bad); min-height: 1.4em; white-space: pre-wrap; font-size: 14px; }
  /* 누르는 맛: 눌림 · 처리 중 · 완료 · 실패 */
  button { transition: transform .08s ease, filter .08s ease, box-shadow .15s ease, background .15s ease; touch-action: manipulation; }
  button:active:not(:disabled) { transform: scale(.94); filter: brightness(.88); }
  .btn.busy { position: relative; pointer-events: none; opacity: .85; animation: pulse .9s ease-in-out infinite; }
  .btn.done { background: var(--ok) !important; color: #fff !important; opacity: 1; animation: none; } .btn.shake { background: var(--bad) !important; color: #fff !important; animation: shake .35s; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(75,61,242,.28); } } @keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }
  .tg button.pend { animation: pulse .9s ease-in-out infinite; outline: 2px solid var(--pri); outline-offset: -3px; }
  .tg.flash { animation: flashok .7s ease; } @keyframes flashok { 0% { box-shadow: 0 0 0 0 rgba(18,144,90,.7); } 100% { box-shadow: 0 0 0 14px rgba(18,144,90,0); } }
  #bar { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: #ffd54a; z-index: 60; transition: width .3s; } #bar.on { width: 85%; transition: width 6s cubic-bezier(.1,.7,.3,1); }
  .hdbtn { background: rgba(255,255,255,.2); border: 0; color: #fff; padding: 6px 10px; border-radius: 99px; font-size: 14px; font-weight: 700; margin-left: 6px; } .hdbtn.off { opacity: .45; }
  .tool { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); } .tool:last-child { border-bottom: 0; } .tool .tx { flex: 1; min-width: 0; } .tool .btn { flex: 0 0 auto; padding: 10px 14px; font-size: 14px; }
  .qrg { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; } .qrc { border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; background: #fff; color: #111; } .qrc b { font-size: 15px; } .qrc .d { font-size: 12px; color: #555; min-height: 32px; margin: 2px 0 6px; } .qrc .q { display: flex; justify-content: center; } .qrc .u { font-size: 10px; word-break: break-all; color: #444; margin-top: 6px; text-align: left; }
  input:disabled { opacity: .6; }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; } .kv:last-child { border-bottom: 0; } .kv b.rd { color: var(--bad); }
  .big { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; } .big .bx { background: var(--bg); border-radius: 12px; padding: 12px; } .big .n { font-size: 22px; font-weight: 900; } .big .l { font-size: 12px; color: var(--mut); margin-top: 2px; }
  .dv { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; } .dv:last-child { border-bottom: 0; }

  @media print { header, nav, .noprint, .toast, #bar { display: none !important; } body { background: #fff; } main { max-width: none; padding: 0; } section { display: none !important; } section#p-qr { display: block !important; } .card { border: 0; } }
  body.pcard .qrg { display: none !important; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="login">
  <h2>🔐 문화코인 관리자</h2>
  <div class="desc">관리자 비밀번호를 입력하세요.<br>운영 PIN(태블릿용)과는 다른 번호예요.</div>
  <input id="pw" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" style="width:100%" onclick="login()">들어가기</button>
  <div class="err" id="lerr"></div>
</div>

<div id="app" hidden>
  <header>
    <h1><span>🪙 문화코인 관리자</span><span><button class="hdbtn" id="bSnd" onclick="togSnd()">🔊</button><button class="hdbtn" id="bVib" onclick="togVib()">📳</button><button class="hdbtn" onclick="reload(true)">🔄</button></span></h1>
    <nav id="nav"></nav>
  </header>
  <main>
    <section id="p-dash"></section>
    <section id="p-awd" hidden></section>
    <section id="p-sw" hidden></section>
    <section id="p-ses" hidden></section>
    <section id="p-lst" hidden></section>
    <section id="p-msg" hidden></section>
    <section id="p-all" hidden></section>
    <section id="p-tool" hidden></section>
    <section id="p-qr" hidden></section>
    <section id="p-sec" hidden></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
/* 서버 주소 (index.html 의 API_URL 과 같은 주소) */
var API_URL = 'https://script.google.com/macros/s/AKfycbxBcTW2Pmh0zMAMqXArfnAmiRgTCuyfuoRXJegWzeFzf-a8GzWyjX2aoPSG1CaYIvxV/exec';
function $(id) { return document.getElementById(id); }
function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} return null; }
var _inflight = 0;
function barOn() { var b = $('bar'); if (!_inflight++) { b.classList.remove('on'); void b.offsetWidth; b.classList.add('on'); } }
function barOff() { if (--_inflight <= 0) { _inflight = 0; var b = $('bar'); b.style.width = '100%'; setTimeout(function () { b.classList.remove('on'); b.style.width = ''; }, 250); } }
/* 누르는 즉시 느낌: 진동 · 소리 · 눌림 효과. 소리/진동은 위쪽 🔊 📳 로 끌 수 있어요 */
var FB = { snd: lsGet('fbSnd') !== '0', vib: lsGet('fbVib') !== '0' }, _ac = null;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function acx() { try { _ac = _ac || new (window.AudioContext || window.webkitAudioContext)(); if (_ac.state === 'suspended') _ac.resume(); } catch (e) {} return _ac; }
function tone(f, d, v) { if (!FB.snd) return; var a = acx(); if (!a) return; try { var o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.value = v || 0.12; o.connect(g); g.connect(a.destination); var t = a.currentTime; g.gain.setValueAtTime(v || 0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); o.start(t); o.stop(t + d + 0.02); } catch (e) {} }
function vib(p) { if (FB.vib && navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }
function tap() { vib(12); tone(660, .05, .06); }
function fb(ok) { if (ok) { vib(35); tone(880, .09); setTimeout(function () { tone(1320, .12); }, 90); } else { vib([70, 50, 70]); tone(220, .25, .15); } }
function paintFb() { $('bSnd').textContent = FB.snd ? '🔊' : '🔇'; $('bSnd').classList.toggle('off', !FB.snd); $('bVib').textContent = FB.vib ? '📳' : '📴'; $('bVib').classList.toggle('off', !FB.vib); }
function togSnd() { FB.snd = !FB.snd; lsSet('fbSnd', FB.snd ? '1' : '0'); paintFb(); if (FB.snd) { tone(880, .1); } toast(FB.snd ? '소리 켬' : '소리 끔', 1200); }
function togVib() { FB.vib = !FB.vib; lsSet('fbVib', FB.vib ? '1' : '0'); paintFb(); if (FB.vib) vib(40); toast(!navigator.vibrate ? '이 기기는 웹에서 진동을 지원하지 않아요 (아이폰 등)' : (FB.vib ? '진동 켬' : '진동 끔'), 2200); }
// 버튼 하나를 '누름 → 처리 중 → 완료/실패' 로 보여 줍니다. fn 은 true/false 로 끝나는 Promise 를 돌려줘야 해요.
function run(btn, fn, busyTxt) {
  var old = btn.textContent; btn.disabled = true; btn.classList.add('busy'); btn.textContent = busyTxt || '처리 중…'; tap();
  return fn().then(function (ok) {
    btn.classList.remove('busy'); if (ok === false) { btn.textContent = '⚠ 안 됐어요'; btn.classList.add('shake'); fb(false); } else { btn.textContent = '✓ 완료'; btn.classList.add('done'); fb(true); }
    setTimeout(function () { if (!btn.isConnected) return; btn.textContent = old; btn.classList.remove('done', 'shake'); btn.disabled = false; }, 1100); return ok;
  });
}
function flash(g) { g.classList.remove('flash'); void g.offsetWidth; g.classList.add('flash'); }
document.addEventListener('pointerdown', function (e) { if (e.target.closest && e.target.closest('button') && !e.target.closest('button').disabled) { acx(); } }, true);

function api(fn, args) {
  barOn();
  return fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) { if (j && j.error) throw new Error(j.error); return j.result; })
    .then(function (r) { barOff(); return r; }, function (e) { barOff(); throw e; });
}
function toast(m, ms) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, ms || 2600); }

var PW = '', D = null, tab = 'dash';
var TABS = [['dash', '📡 현황'], ['sw', '⚡ 스위치'], ['ses', '🎤 발표'], ['lst', '📋 목록 편집'], ['msg', '💌 응원 메시지'], ['awd', '🏅 시상·보고'], ['all', '⚙ 설정값'], ['tool', '🛠 시트 도구'], ['qr', '🔗 QR 모음'], ['sec', '🔑 비밀번호']];
// 열림/닫힘 처럼 두 값 중 하나인 설정은 스위치로 보여줍니다
var PAIRS = { '열림': ['열림', '닫힘'], '닫힘': ['열림', '닫힘'], '허용': ['허용', '차단'], '차단': ['허용', '차단'] };
var NICE = { '전체': '비상 스위치 (전체)', '슈퍼챗': '후원 투표 (전광판)', '슈퍼챗폰후원': '폰으로 후원', '응원메시지': '응원 메시지', '근로지급': '근로 장학금 지급', '코인마켓': '코인 마켓', '발표장': '발표장 (입장·퇴장)', '부스': '학급 부스', '학술제응원': '작품 좋아요' };

function login() {
  PW = $('pw').value; if (!PW) return;
  $('lerr').textContent = '확인 중...';
  api('adminLoad', [PW]).then(function (r) {
    if (!r.ok) { $('lerr').textContent = r.msg || '들어갈 수 없어요.'; return; }
    ss('apw', PW); $('login').hidden = true; $('app').hidden = false; D = r; paintFb(); build(); draw();
  }).catch(function () { $('lerr').textContent = '연결에 실패했어요. 인터넷을 확인해 주세요.'; });
}
function logout() { ss('apw', null); PW = ''; location.reload(); }
function reload(show) {
  return api('adminLoad', [PW]).then(function (r) { if (!r.ok) { toast(r.msg || '불러오지 못했어요'); return; } D = r; draw(); if (show) toast('새로 불러왔어요'); }).catch(function () { toast('연결에 실패했어요'); });
}
(function init() { var p = ss('apw'); if (p) { $('pw').value = p; login(); } })();

function build() {
  var n = $('nav'); n.innerHTML = '';
  TABS.forEach(function (t) { var b = el('button', t[0] === tab ? 'on' : '', t[1]); b.onclick = function () { tab = t[0]; build(); draw(); }; n.appendChild(b); });
}
function draw() {
  TABS.forEach(function (t) { $('p-' + t[0]).hidden = t[0] !== tab; });
  clearInterval(window._dt); ({ dash: drawDash, awd: drawAwd, sw: drawSw, ses: drawSes, lst: drawLst, msg: drawMsg, all: drawAll, tool: drawTool, qr: drawQr, sec: drawSec })[tab]();
}
function save(k, v) { return api('adminSet', [PW, k, v]).then(function (r) { if (!r.ok) { toast(r.msg || '저장하지 못했어요'); fb(false); return false; } toast('저장했어요 ✓', 1500); fb(true); return true; }).catch(function () { toast('연결에 실패했어요'); fb(false); return false; }); }
function find(k) { for (var i = 0; i < D.settings.length; i++) if (D.settings[i].k === k) return D.settings[i]; return null; }

/* ---------- 스위치 ---------- */
function toggle(s, onSave) {
  var pair = PAIRS[s.v] || ['열림', '닫힘'], g = el('div', 'tg'), busy = false;
  function paint(cur, pend) {
    g.innerHTML = '';
    pair.forEach(function (opt, i) {
      var b = el('button', (cur === opt ? 'on ' : '') + (i === 0 ? 'pos' : 'neg') + (pend === opt ? ' pend' : ''), opt);
      b.onclick = function () {
        if (busy || cur === opt) return; tap(); busy = true; var prev = cur; paint(opt, opt);          // 누르는 즉시 표시가 옮겨가요 (저장 중에는 깜빡임)
        save(s.k, opt).then(function (ok) { busy = false; if (ok) { s.v = opt; paint(opt); flash(g); if (onSave) onSave(); } else paint(prev); });
      };
      g.appendChild(b);
    });
  }
  paint(s.v); return g;
}
function drawSw() {
  var p = $('p-sw'); p.innerHTML = '';
  var c = el('div', 'card'); c.appendChild(el('h3', '', '행사 스위치')); c.appendChild(el('div', 'desc', '눌러서 바로 열고 닫을 수 있어요. 비상 스위치를 닫으면 모든 결제가 멈춥니다.'));
  var order = ['전체', '발표장', '학술제응원', '부스', '코인마켓', '슈퍼챗', '슈퍼챗폰후원', '응원메시지', '근로지급'], shown = 0;

    top.appendChild(el('div', 'desc', '마지막 거래: ' + (sinceTx === null ? '아직 없음' : ago(sinceTx)) + ' · 총 거래 ' + d.txTotal + '건 · 학생 ' + d.students + '명 · ' + new Date(d.now).toLocaleTimeString('ko-KR') + ' 기준'));
    p.appendChild(top);
    var fl = el('div', 'card'); fl.appendChild(el('h3', '', '스위치 상태'));
    var row = el('div', 'row'); Object.keys(d.flags).forEach(function (k) { var v = d.flags[k]; if (!v) return; row.appendChild(el('span', 'chip ' + (v === '열림' ? 'in' : 'out'), (NICE[k] || k) + ' · ' + v)); });
    fl.appendChild(row); p.appendChild(fl);
    var dv = el('div', 'card'); dv.appendChild(el('h3', '', '기기 상태')); dv.appendChild(el('div', 'desc', '태블릿·전광판이 2분마다 보내는 신호예요. 6분 넘게 소식이 없으면 빨간색으로 표시돼요.'));
    if (!d.devices.length) dv.appendChild(el('div', 'desc', '아직 신호를 보낸 기기가 없어요.'));
    d.devices.forEach(function (x) { var bad = x.ago > 360; var r = el('div', 'dv'); r.appendChild(el('span', 'chip ' + (bad ? 'bad' : 'in'), bad ? '끊김?' : '정상')); r.appendChild(el('b', '', x.name)); r.appendChild(el('span', 'desc', ago(x.ago))); dv.appendChild(r); });
    p.appendChild(dv);
    var ss_ = el('div', 'card'); ss_.appendChild(el('h3', '', '발표 현황'));
    d.sessions.forEach(function (s) { var c = s.counts || {}, tot = 0, line = []; Object.keys(c).forEach(function (k) { tot += c[k]; line.push(k + ' ' + c[k]); }); var r = el('div', 'dv'); r.appendChild(el('span', 'chip ' + (s.open ? 'in' : ''), s.open ? '진행' : '대기')); r.appendChild(el('b', '', s.name)); r.appendChild(el('span', 'desc', (tot ? '기록 ' + tot + '명 (' + line.join(' · ') + ')' : '기록 없음'))); ss_.appendChild(r); });
    if (!d.sessions.length) ss_.appendChild(el('div', 'desc', '등록된 발표가 없어요.'));
    p.appendChild(ss_);
    var kd = el('div', 'card'); kd.appendChild(el('h3', '', '최근 1시간 종류별 거래'));
    var ks = Object.keys(d.kinds); if (!ks.length) kd.appendChild(el('div', 'desc', '없음')); ks.forEach(function (k) { kd.appendChild(kv(k, d.kinds[k] + '건')); }); p.appendChild(kd);
    var wn = el('div', 'card'); wn.appendChild(el('h3', '', '확인할 것'));
    var any = false;
    if (d.syncFail) { any = true; wn.appendChild(kv('⚠ 동기화 실패 기록', d.syncFail + '건 (시트 [동기화실패])', 'rd')); d.syncRecent.forEach(function (x) { wn.appendChild(el('div', 'desc', '· ' + x.mode + ' — ' + x.why)); }); }
    if (d.msgBad) { any = true; wn.appendChild(kv('🚫 차단된 응원 메시지(최근)', d.msgBad + '건', 'rd')); }
    if (!any) wn.appendChild(el('div', 'desc', '지금은 문제가 없어요 ✓'));
    p.appendChild(wn);
  }
  function load() { if (tab !== 'dash') return; api('adminDash', [PW]).then(function (r) { if (r && r.ok) { DASH = r; paint(); } else if (r) toast(r.msg || '불러오지 못했어요'); }).catch(function () { }); }
  paint(); load(); window._dt = setInterval(load, 15000);
}

/* ---------- 🏅 시상 · 보고 ---------- */
function drawAwd() {
  var p = $('p-awd'); p.innerHTML = '';
  var h = el('div', 'card'); h.appendChild(el('h3', '', '시상 후보 (관리자용: 실명·학번 전체)'));
  h.appendChild(el('div', 'desc', '작품·발표 좋아요상: 좋아요를 가장 많이 받은 작품·발표 · 스크루지상: 코인을 벌었는데 가장 적게 쓴 사람 · 플렉스상: 가장 많이 쓴 사람 · 후원왕: 후원 투표에 가장 많이 쓴 사람 · 응원왕: 응원 메시지를 가장 많이 보낸 사람(차단·숨김 제외). 동점이면 잔액이 많은 순이에요. 전광판 시상 화면의 이름 표시는 ⚙ 설정값 [시상이름표시] 에서 정해요.'));
  var row = el('div', 'row'); var rb = el('button', 'btn', '🔄 다시 계산'); rb.onclick = function () { run(rb, load); }; row.appendChild(rb);
  var ob = el('button', 'btn sec', '📄 성과 보고서 열기'); ob.onclick = function () { ss('apw', PW); window.open('report.html', '_blank'); }; row.appendChild(ob);
  h.appendChild(row); p.appendChild(h);
  var box = el('div'); p.appendChild(box);
  function paint(a) {
    box.innerHTML = '';
    a.forEach(function (x) {
      var c = el('div', 'card'); c.appendChild(el('h3', '', x.emoji + ' ' + x.title)); c.appendChild(el('div', 'desc', x.sub));
      if (!x.list.length) c.appendChild(el('div', 'desc', '아직 후보가 없어요.'));
      x.list.forEach(function (w) { var r = el('div', 'dv'); r.appendChild(el('span', 'chip ' + (w.rank === 1 ? 'in' : ''), w.rank + '위')); r.appendChild(el('b', '', w.name + ' (' + w.no + ')')); r.appendChild(el('span', 'desc', w.cls + ' · ' + w.val.toLocaleString() + x.unit + (w.bal == null ? '' : ' · 잔액 ' + w.bal.toLocaleString() + 'C'))); c.appendChild(r); });
      box.appendChild(c);
    });
  }
  function load() { return api('adminAwards', [PW]).then(function (r) { if (r && r.ok) { paint(r.awards); return true; } toast((r && r.msg) || '불러오지 못했어요'); return false; }).catch(function () { toast('연결에 실패했어요'); return false; }); }
  box.appendChild(el('div', 'card', '계산 중…')); load();
}
</script>
