<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR 재발급 창구</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background: #eef1fb; color: #1b2437; }
  header { background: linear-gradient(90deg, #1b2a52, #31408a); color: #fff; padding: 14px; text-align: center; font-size: 20px; font-weight: 800; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px; }
  .box { background: #fff; border-radius: 20px; padding: 22px; box-shadow: 0 6px 18px rgba(30,40,80,.1); margin-bottom: 14px; text-align: center; }
  input { font-size: 28px; padding: 12px; width: 100%; text-align: center; border: 2px solid #e3e7f0; border-radius: 14px; background: #f6f7fb; }
  input:focus { outline: none; border-color: #3b5bfd; background: #fff; }
  button { font-size: 20px; font-weight: 800; padding: 14px 22px; border: 0; border-radius: 14px; color: #fff; background: linear-gradient(135deg, #3b5bfd, #2a3fc9); margin-top: 12px; width: 100%; }
  button.warn { background: linear-gradient(135deg, #ff7a45, #e5484d); } button.gray { background: #8b93a8; }
  .msg { min-height: 1.5em; margin-top: 8px; color: #c62828; font-size: 17px; }
  .nm { font-size: 34px; font-weight: 900; } .sub { font-size: 20px; color: #6b7690; margin-top: 4px; }
  #card { display: inline-block; border: 2px dashed #9aa3bd; border-radius: 12px; padding: 14px 18px; margin-top: 10px; }
  #card .q { display: flex; justify-content: center; } #card .cn { font-size: 22px; font-weight: 900; margin-top: 8px; } #card .ci { font-size: 12px; color: #888; }
  .note { font-size: 15px; color: #c62828; margin-top: 10px; }
  [hidden] { display: none !important; }
  @media print { body * { visibility: hidden; } #card, #card * { visibility: visible; } #card { position: absolute; left: 0; top: 0; border: 1px dashed #999; margin: 0; } @page { size: A6; margin: 10mm; } }
</style>
</head>
<body>
<header>🪪 QR 재발급 창구</header>
<main>
  <div class="box" id="vPin">
    <div style="font-weight:800;margin-bottom:10px">운영 PIN</div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">시작</button><div class="msg" id="m1"></div>
  </div>
  <div class="box" id="vFind" hidden>
    <div style="font-weight:800;margin-bottom:10px">학번을 입력하세요</div>
    <input id="no" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter')find()">
    <button onclick="find()">조회</button><div class="msg" id="m2"></div>
  </div>
  <div class="box" id="vConfirm" hidden>
    <div class="nm" id="cName"></div><div class="sub" id="cSub"></div>
    <div class="note" style="color:#6b7690">본인 확인(얼굴·학생증) 후 발급하세요.<br>발급하면 <b>이전 QR은 즉시 사용할 수 없고</b>, 잔액은 그대로 유지됩니다.</div>
    <button class="warn" onclick="reissue()">새 QR 발급</button><button class="gray" onclick="reset()">취소</button><div class="msg" id="m3"></div>
  </div>
  <div class="box" id="vCard" hidden>
    <div class="nm">✅ 발급 완료</div>
    <div id="card"><div class="q" id="qr"></div><div class="cn" id="cn"></div><div class="ci" id="ci"></div></div>
    <button onclick="window.print()">🖨 카드 인쇄</button><button class="gray" onclick="reset()">다음 학생</button>
    <div class="note">인쇄 후 학생에게 전달하고, 이전 카드는 회수해 주세요.</div>
  </div>
</main>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbxBcTW2Pmh0zMAMqXArfnAmiRgTCuyfuoRXJegWzeFzf-a8GzWyjX2aoPSG1CaYIvxV/exec';
var pin = '', cur = '';
function $(id) { return document.getElementById(id); }
function fmt(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function api(fn, args) {
  return fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) { if (j && j.error) throw new Error(j.error); return j.result; });
}
function view(id) { ['vPin', 'vFind', 'vConfirm', 'vCard'].forEach(function (v) { $(v).hidden = (v !== id); }); }
function login() {
  pin = $('pin').value.trim(); if (!pin) return; $('m1').innerText = '확인 중...';
  api('deskLookup', [pin, '0']).then(function (r) {
    if (r.msg && /PIN/.test(r.msg)) { $('m1').innerText = r.msg; return; }
    $('pin').value = ''; $('m1').innerText = ''; view('vFind'); $('no').focus();
  }).catch(function (e) { $('m1').innerText = '서버 연결 실패: ' + e.message; });
}
function find() {
  var no = $('no').value.trim(); if (!no) return; $('m2').innerText = '조회 중...';
  api('deskLookup', [pin, no]).then(function (r) {
    if (!r.ok) { $('m2').innerText = r.msg; return; }
    cur = r.no; $('m2').innerText = '';
    $('cName').innerText = r.name + ' (' + r.no + ')';
    $('cSub').innerText = '현재 잔액 ' + fmt(r.balance) + 'C' + (r.hasId ? '' : ' · 아직 QR 미발급');
    view('vConfirm');
  }).catch(function (e) { $('m2').innerText = '연결 실패: ' + e.message; });
}
function reissue() {
  $('m3').innerText = '발급 중...';
  api('deskReissue', [pin, cur]).then(function (r) {
    if (!r.ok) { $('m3').innerText = r.msg; return; }
    $('qr').innerHTML = ''; new QRCode($('qr'), { text: r.id, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
    $('cn').innerText = r.no + ' ' + r.name; $('ci').innerText = r.id; $('m3').innerText = ''; view('vCard');
  }).catch(function (e) { $('m3').innerText = '연결 실패(발급 여부를 [재발급기록] 시트에서 확인): ' + e.message; });
}
function reset() { $('no').value = ''; $('m2').innerText = ''; $('m3').innerText = ''; view('vFind'); $('no').focus(); }
</script>
</body>
</html>
